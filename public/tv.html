<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lalling Games – TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Rock+Salt&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-brush: 'Caveat Brush', Georgia, serif;
      --font-impact: 'Rock Salt', Georgia, serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #080010;
      font-family: var(--font-brush);
    }

    /* ── Background image ── */
    #tv-bg {
      position: fixed;
      inset: 0;
      background: url('tv-bg.jpg.png') center/cover no-repeat;
      z-index: 0;
    }

    /* ── Character animation layer ── */
    #char-anim {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      /* Match sizing/position to your drawing.
         Default: full screen, centered, same as background. */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #char-anim img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* ── Auth overlay ── */
    #auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 0, 20, 0.94);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .auth-box {
      background: rgba(15, 0, 40, 0.97);
      border: 2px solid #7a0000;
      border-radius: 14px;
      padding: 2.5rem 3rem;
      text-align: center;
      min-width: 320px;
      box-shadow: 0 0 40px rgba(180, 20, 20, 0.3);
    }

    .auth-box h2 {
      font-family: var(--font-impact);
      font-size: 1.3rem;
      font-weight: 400;
      color: #e04040;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.3rem;
      text-shadow: 0 0 12px rgba(200,30,10,0.6), 2px 2px 0 rgba(60,0,0,0.5);
    }

    .auth-box p {
      font-family: var(--font-brush);
      color: rgba(255, 255, 255, 0.4);
      font-size: 1rem;
      letter-spacing: 0.05em;
      margin-bottom: 1.8rem;
    }

    .auth-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(139, 0, 0, 0.55);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .auth-box input:focus { border-color: #d03030; }

    .auth-box button {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #7a0000, #b00000);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: opacity 0.2s;
    }
    .auth-box button:hover { opacity: 0.85; }

    .auth-error {
      color: #ff5555;
      font-size: 0.8rem;
      margin-top: 0.6rem;
      display: none;
    }

    /* ── Main TV display ── */
    #tv-display {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: none;
    }

    /* ════════════════════════════════════════
       IDLE MODE – player leaderboard
    ════════════════════════════════════════ */
    #idle-overlay {
      position: absolute;
      right: 2%;
      top: 6%;
      width: 46%;
      height: 88%;
      display: none;
      flex-direction: column;
      justify-content: flex-start;
      padding: 1.5rem 1.8rem;
    }

    .tv-title {
      font-family: var(--font-impact);
      font-size: clamp(1.1rem, 2.6vw, 2rem);
      font-weight: 400;
      color: #fff;
      text-shadow:
        0 0 20px rgba(200, 40, 40, 0.9),
        0 0 45px rgba(200, 40, 40, 0.4),
        3px 3px 0 rgba(80, 5, 0, 0.6),
        0 2px 6px rgba(0, 0, 0, 0.95);
      letter-spacing: 0.04em;
      margin-bottom: 0.2rem;
      filter: url(#paint-box);
    }

    .tv-subtitle {
      font-family: var(--font-brush);
      font-size: clamp(0.8rem, 1.6vw, 1.1rem);
      color: rgba(255, 140, 130, 0.65);
      letter-spacing: 0.1em;
      margin-bottom: 1.6rem;
    }

    .player-list-tv {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .player-row-tv {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.55rem 1rem;
      background:
        radial-gradient(ellipse 90% 60% at 20% 50%, rgba(50,0,5,0.3) 0%, transparent 100%),
        rgba(8, 0, 20, 0.78);
      border: 1.5px solid rgba(120, 0, 0, 0.4);
      border-radius: 4px;
      backdrop-filter: blur(6px);
      filter: url(#paint-box);
      transition: background 0.3s;
    }

    .player-row-tv.top-player {
      border-color: rgba(190, 45, 15, 0.75);
      background:
        radial-gradient(ellipse 80% 60% at 25% 50%, rgba(80,5,0,0.35) 0%, transparent 100%),
        rgba(12, 0, 30, 0.85);
    }

    .player-rank-tv {
      font-family: var(--font-brush);
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: rgba(200, 100, 100, 0.6);
      min-width: 1.8rem;
      text-align: center;
    }

    .top-player .player-rank-tv { color: #e04040; }

    .player-name-tv {
      font-family: var(--font-brush);
      flex: 1;
      font-size: clamp(1.1rem, 2.4vw, 1.6rem);
      color: #fff;
      text-shadow: 0 0 8px rgba(180, 40, 40, 0.35), 1px 1px 0 rgba(0,0,0,0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-points-tv {
      font-family: var(--font-brush);
      font-size: clamp(1.1rem, 2.6vw, 1.75rem);
      color: #e04040;
      text-shadow: 0 0 12px rgba(200, 40, 40, 0.7), 1px 1px 0 rgba(60,0,0,0.5);
      min-width: 3.5rem;
      text-align: right;
    }

    .player-eliminated-tv .player-name-tv  { color: rgba(255,255,255,0.2); }
    .player-eliminated-tv .player-points-tv { color: rgba(220,60,60,0.2); text-shadow: none; }
    .player-eliminated-tv .player-rank-tv  { color: rgba(180,80,80,0.2); }

    /* ════════════════════════════════════════
       POKER MODE
    ════════════════════════════════════════ */
    #poker-overlay {
      position: absolute;
      inset: 0;
      display: none;
    }

    /*
      Red window position in the image (1456×816 reference):
      roughly x: 58%–79%, y: 12%–71%
      Rectangular pane section below arch: ~27%–71%
      Window center: ~68.5% x, ~49% y
    */
    #pot-window {
      position: absolute;
      left: 58%;
      top: 27%;
      width: 22%;
      height: 44%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .pot-label {
      font-family: var(--font-brush);
      font-size: clamp(0.9rem, 2vw, 1.3rem);
      color: #f5c98a;
      letter-spacing: 0.2em;
      margin-bottom: 0.2rem;
      text-shadow:
        0 0 8px rgba(255, 150, 40, 0.9),
        0 0 20px rgba(255, 90, 10, 0.6),
        1px 2px 0 rgba(80, 10, 0, 0.7);
      filter: url(#paint-box);
    }

    .pot-amount {
      font-family: var(--font-impact);
      font-size: clamp(1.8rem, 5.5vw, 4.2rem);
      font-weight: 400;
      color: #ffe8cc;
      line-height: 1;
      text-shadow:
        0 0 10px rgba(255, 200, 100, 0.95),
        0 0 28px rgba(255, 110, 20, 0.85),
        0 0 55px rgba(255, 70, 10, 0.5),
        3px 3px 0 rgba(100, 15, 0, 0.55),
        0 4px 8px rgba(0, 0, 0, 0.9);
      filter: url(#paint-heavy);
      transition: transform 0.15s ease;
    }

    .pot-amount.pop {
      transform: scale(1.15);
    }

    .pot-chips-label {
      font-family: var(--font-brush);
      font-size: clamp(0.65rem, 1.2vw, 0.85rem);
      color: rgba(245, 180, 100, 0.5);
      letter-spacing: 0.15em;
      margin-top: 0.35rem;
      text-shadow: 0 0 6px rgba(255, 100, 20, 0.35);
      filter: url(#paint-box);
    }

    /* Current player – displayed at bottom center */
    #current-player-banner {
      position: absolute;
      bottom: 7%;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
    }

    .turn-label {
      font-family: var(--font-brush);
      font-size: clamp(0.9rem, 2vw, 1.3rem);
      color: rgba(245, 190, 140, 0.8);
      letter-spacing: 0.15em;
      text-shadow:
        0 0 8px rgba(220, 80, 30, 0.6),
        1px 2px 0 rgba(0, 0, 0, 0.6);
      filter: url(#paint-box);
    }

    .turn-player-name {
      font-family: var(--font-impact);
      font-size: clamp(1.8rem, 5.5vw, 4.5rem);
      font-weight: 400;
      color: #ffe8d0;
      text-shadow:
        0 0 15px rgba(255, 200, 100, 0.65),
        0 0 35px rgba(220, 60, 20, 0.75),
        0 0 70px rgba(200, 30, 10, 0.35),
        3px 4px 0 rgba(80, 5, 0, 0.6),
        0 5px 12px rgba(0, 0, 0, 0.95);
      animation: pulse-name 2.2s ease-in-out infinite;
      max-width: 90vw;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      filter: url(#paint-heavy);
    }

    @keyframes pulse-name {
      0%,  100% {
        opacity: 1;
        text-shadow:
          0 0 30px rgba(200,40,40,0.95),
          0 0 60px rgba(200,40,40,0.45),
          0 4px 10px rgba(0,0,0,0.95);
      }
      50% {
        opacity: 0.88;
        text-shadow:
          0 0 50px rgba(220,40,40,1),
          0 0 100px rgba(200,40,40,0.65),
          0 0 140px rgba(200,40,40,0.25),
          0 4px 10px rgba(0,0,0,0.95);
      }
    }

    .poker-phase-badge {
      font-family: var(--font-brush);
      font-size: clamp(0.75rem, 1.5vw, 1rem);
      color: rgba(255, 200, 170, 0.7);
      letter-spacing: 0.12em;
      background: rgba(8, 0, 22, 0.72);
      padding: 0.2rem 1.1rem;
      border: 1.5px solid rgba(120, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      filter: url(#paint-box);
    }

    /* Showdown special */
    .showdown-text {
      animation: pulse-name 1.4s ease-in-out infinite;
      color: #ffaa80 !important;
      text-shadow:
        0 0 30px rgba(255, 120, 50, 0.95),
        0 0 60px rgba(255, 100, 30, 0.5),
        0 4px 10px rgba(0,0,0,0.95) !important;
    }

    /* ════════════════════════════════════════
       PLAYER BAND – right side, connected boxes
    ════════════════════════════════════════ */

    /* Outer clip+fade container */
    #player-band {
      position: absolute;
      right: 0;
      top: 5%;
      width: 22%;
      height: 90%;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );
    }

    /* Fixed vertical line – sits inside band but outside inner so it doesn't scroll */
    #band-v-line {
      position: absolute;
      left: 14px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(155, 22, 6, 0.75) 12%,
        rgba(155, 22, 6, 0.75) 88%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 2;
      filter: url(#paint-line);
    }

    /* Scrolling inner list */
    #player-band-inner {
      position: absolute;
      top: 0; left: 0; right: 0;
      will-change: transform;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Each player row */
    .band-player {
      height: 78px;
      display: flex;
      align-items: center;
      padding: 0 10px 0 36px; /* 36px leaves room for line + connector */
      position: relative;
      flex-shrink: 0;
      transition: opacity 0.5s;
      opacity: 0.28;
    }

    .band-player.bp-active  { opacity: 1; }
    .band-player.bp-folded  { opacity: 0.1; }
    .band-player.bp-allin   { opacity: 0.5; }

    /* Horizontal connector: line → box */
    .band-player::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 50%;
      width: 18px;
      height: 1px;
      background: rgba(150, 22, 8, 0.55);
      transform: translateY(-50%);
      transition: background 0.5s;
    }
    .band-player.bp-active::before {
      background: rgba(210, 65, 15, 0.9);
      width: 20px;
    }

    /* The box itself */
    .bp-box {
      flex: 1;
      min-width: 0;
      background:
        radial-gradient(ellipse 85% 55% at 15% 40%, rgba(55,0,5,0.28) 0%, transparent 100%),
        radial-gradient(ellipse 60% 70% at 80% 60%, rgba(20,0,35,0.2) 0%, transparent 100%),
        rgba(6, 0, 16, 0.84);
      border: 1.5px solid rgba(110, 14, 6, 0.45);
      border-radius: 2px;
      padding: 0.38rem 0.6rem;
      backdrop-filter: blur(8px);
      filter: url(#paint-box);
      transition: border-color 0.5s, box-shadow 0.5s;
    }

    .band-player.bp-active .bp-box {
      border-color: rgba(200, 55, 12, 0.9);
      box-shadow:
        0 0 20px rgba(180, 40, 8, 0.5),
        0 0 40px rgba(160, 25, 5, 0.2),
        inset 0 0 12px rgba(140, 20, 0, 0.15);
    }

    .band-player.bp-folded .bp-box {
      border-color: rgba(70, 70, 70, 0.25);
    }

    /* Name row inside box */
    .bp-name {
      font-family: var(--font-brush);
      font-size: clamp(0.9rem, 1.8vw, 1.2rem);
      color: rgba(240, 210, 175, 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      line-height: 1.2;
      transition: color 0.5s, text-shadow 0.5s;
    }

    .band-player.bp-active .bp-name {
      color: #ffe8cc;
      text-shadow:
        0 0 8px rgba(255, 170, 70, 0.7),
        0 0 22px rgba(210, 60, 15, 0.6),
        1px 2px 0 rgba(60, 4, 0, 0.55);
    }

    /* Bottom row: chips + role badges */
    .bp-meta {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.15rem;
      flex-wrap: wrap;
    }

    .bp-chips {
      font-family: var(--font-brush);
      font-size: clamp(0.75rem, 1.3vw, 0.95rem);
      color: rgba(190, 135, 80, 0.45);
      flex: 1;
      transition: color 0.5s;
    }

    .band-player.bp-active .bp-chips {
      color: rgba(240, 185, 100, 0.88);
      text-shadow: 0 0 6px rgba(240, 130, 30, 0.4);
    }

    .bp-role {
      font-family: var(--font-brush);
      font-size: clamp(0.55rem, 1vw, 0.72rem);
      padding: 0.05rem 0.32rem;
      border-radius: 2px;
      line-height: 1.4;
      white-space: nowrap;
      filter: url(#paint-box);
    }

    .bp-role.r-dealer { background: rgba(200,160,30,0.2);  color: #f0c030; border: 1px solid rgba(210,170,25,0.4); }
    .bp-role.r-sb     { background: rgba(50,110,190,0.2);  color: #80b8ff; border: 1px solid rgba(70,130,210,0.4); }
    .bp-role.r-bb     { background: rgba(170,35,15,0.22);  color: #ff8068; border: 1px solid rgba(190,55,25,0.45); }
    .bp-role.r-fold   { background: rgba(70,70,70,0.18);   color: #888;    border: 1px solid rgba(110,110,110,0.2); }
    .bp-role.r-allin  { background: rgba(190,25,25,0.22);  color: #ff6858; border: 1px solid rgba(210,45,25,0.45); }
  </style>
</head>
<body>

<!-- SVG paint filters -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Box edges: roughened like painted borders -->
    <filter id="paint-box" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055 0.042" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Lines: more wobbly brush strokes -->
    <filter id="paint-line" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.09" numOctaves="3" seed="14" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Heavy distortion for decorative accents -->
    <filter id="paint-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.06" numOctaves="5" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="tv-bg"></div>
<div id="char-anim"><img id="char-frame" src="" alt="" /></div>

<!-- ══════════════════════════════════
     AUTH OVERLAY
══════════════════════════════════ -->
<div id="auth-overlay">
  <div class="auth-box">
    <h2>📺 TV-Ansicht</h2>
    <p>Nur für Admins · Admin only</p>
    <input
      type="password"
      id="auth-input"
      placeholder="Admin-Passwort"
      autocomplete="current-password"
      autocapitalize="none"
    />
    <button onclick="doAuth()">Zugang</button>
    <div class="auth-error" id="auth-error">Falsches Passwort</div>
  </div>
</div>

<!-- ══════════════════════════════════
     TV DISPLAY
══════════════════════════════════ -->
<div id="tv-display">

  <!-- IDLE: All players + points -->
  <div id="idle-overlay">
    <div class="tv-title">Lalling Games</div>
    <div class="tv-subtitle">Das Culling Spiel · Das Trinkspiel</div>
    <div class="player-list-tv" id="player-list-tv"></div>
  </div>

  <!-- POKER: Pot in red window + current player -->
  <div id="poker-overlay">

    <!-- Player band: right side, boxes connected by vertical line -->
    <div id="player-band">
      <div id="band-v-line"></div>
      <div id="player-band-inner"></div>
    </div>

    <!-- Pot overlaid on the red window in the artwork -->
    <div id="pot-window">
      <div class="pot-label">Pot</div>
      <div class="pot-amount" id="pot-amount">0</div>
      <div class="pot-chips-label">Chips</div>
    </div>

    <!-- Current player at the bottom -->
    <div id="current-player-banner">
      <div class="turn-label" id="turn-label">Am Zug</div>
      <div class="turn-player-name" id="turn-player-name">–</div>
      <div class="poker-phase-badge" id="poker-phase-badge">–</div>
    </div>

  </div>

</div>

<script>
  // ══════════════════════════════════════════════
  // CHARACTER ANIMATION
  // ──────────────────────────────────────────────
  // 1. Draw your idle cycle frames in Krita/Photoshop/Procreate
  // 2. Export as PNGs with transparency into public/:
  //      tv-char-1.png, tv-char-2.png, tv-char-3.png …
  // 3. Set CHAR_FRAMES to however many frames you drew
  // 4. Adjust CHAR_FPS for speed (8–12 is natural for idle)
  // ══════════════════════════════════════════════
  const CHAR_FRAMES = 0;   // ← set to your frame count (0 = disabled)
  const CHAR_FPS    = 10;  // ← frames per second

  ;(function initCharAnim() {
    if (CHAR_FRAMES < 1) {
      document.getElementById('char-anim').style.display = 'none';
      return;
    }
    const img = document.getElementById('char-frame');
    let frame = 0;
    // Preload all frames
    const preloaded = Array.from({ length: CHAR_FRAMES }, (_, i) => {
      const p = new Image();
      p.src = `tv-char-${i + 1}.png`;
      return p;
    });
    setInterval(() => {
      frame = (frame + 1) % CHAR_FRAMES;
      img.src = preloaded[frame].src;
    }, 1000 / CHAR_FPS);
    img.src = preloaded[0].src;
  })();

  // ══════════════════════════════════════════════

  const PHASE_LABELS = {
    preflop:  'Pre-Flop',
    flop:     'Flop',
    turn:     'Turn',
    river:    'River',
    showdown: 'Showdown',
    ended:    'Hand beendet',
    setup:    'Vorbereitung',
  };

  let pollTimer = null;
  let lastPot   = null;

  // ── Restore session auth ──
  const savedPw = sessionStorage.getItem('tv-admin-pw');
  if (savedPw) showTV();

  document.getElementById('auth-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doAuth();
  });

  async function doAuth() {
    const pw = document.getElementById('auth-input').value.trim();
    if (!pw) return;
    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw }),
      });
      if (res.ok) {
        const data = await res.json();
        if (data.success) {
          sessionStorage.setItem('tv-admin-pw', pw);
          document.getElementById('auth-error').style.display = 'none';
          showTV();
          return;
        }
      }
    } catch (_) {}
    document.getElementById('auth-error').style.display = 'block';
  }

  function showTV() {
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('tv-display').style.display   = 'block';
    startPolling();
  }

  function startPolling() {
    poll();
    pollTimer = setInterval(poll, 2000);
  }

  async function poll() {
    try {
      const [playersRes, pokerRes] = await Promise.all([
        fetch('/api/players'),
        fetch('/api/poker/state'),
      ]);
      const players = await playersRes.json();
      const poker   = pokerRes.ok ? await pokerRes.json() : null;
      render(players, poker);
    } catch (_) { /* silently retry */ }
  }

  // ── Main render ──
  function render(players, poker) {
    const activePhases = ['preflop', 'flop', 'turn', 'river', 'showdown'];
    const hasPoker = poker && activePhases.includes(poker.phase);

    document.getElementById('idle-overlay').style.display  = hasPoker ? 'none'  : 'flex';
    document.getElementById('poker-overlay').style.display = hasPoker ? 'block' : 'none';

    if (hasPoker) renderPoker(poker);
    else          renderIdle(players);
  }

  // ── Idle: leaderboard ──
  function renderIdle(players) {
    const sorted = [...players].sort((a, b) => b.points - a.points);
    const list   = document.getElementById('player-list-tv');
    list.innerHTML = sorted.map((p, i) => `
      <div class="player-row-tv ${p.points === 0 ? 'player-eliminated-tv' : ''} ${i === 0 && p.points > 0 ? 'top-player' : ''}">
        <div class="player-rank-tv">#${i + 1}</div>
        <div class="player-name-tv">${escHtml(p.name)}</div>
        <div class="player-points-tv">${p.points}</div>
      </div>
    `).join('');
  }

  // ── Poker: pot + current player ──
  const ITEM_H = 78; // must match .band-player height in CSS

  function renderPoker(poker) {
    const pot = poker.pot ?? 0;

    // Animate pot if changed
    const potEl = document.getElementById('pot-amount');
    if (pot !== lastPot) {
      potEl.textContent = pot;
      potEl.classList.remove('pop');
      void potEl.offsetWidth;
      potEl.classList.add('pop');
      setTimeout(() => potEl.classList.remove('pop'), 200);
      lastPot = pot;
    }

    const phase         = poker.phase;
    const players       = poker.players ?? [];
    const activeIdx     = poker.currentPlayerIdx ?? 0;
    const currentPlayer = players[activeIdx];
    const badgeEl       = document.getElementById('poker-phase-badge');
    const labelEl       = document.getElementById('turn-label');
    const nameEl        = document.getElementById('turn-player-name');
    const bannerEl      = document.getElementById('current-player-banner');

    badgeEl.textContent = PHASE_LABELS[phase] || phase;

    // ── Player band: connected boxes ──
    const inner = document.getElementById('player-band-inner');
    inner.innerHTML = players.map((p, i) => {
      const isActive = i === activeIdx && phase !== 'showdown';
      const roles = [];
      if (i === poker.dealerIdx) roles.push('<span class="bp-role r-dealer">D</span>');
      if (i === poker.sbIdx)     roles.push('<span class="bp-role r-sb">SB</span>');
      if (i === poker.bbIdx)     roles.push('<span class="bp-role r-bb">BB</span>');
      if (p.folded)              roles.push('<span class="bp-role r-fold">FOLD</span>');
      if (p.allIn)               roles.push('<span class="bp-role r-allin">ALL IN</span>');
      const cls = [
        'band-player',
        isActive  ? 'bp-active' : '',
        p.folded  ? 'bp-folded' : '',
        p.allIn   ? 'bp-allin'  : '',
      ].filter(Boolean).join(' ');
      return `<div class="${cls}">
        <div class="bp-box">
          <span class="bp-name">${escHtml(p.name)}</span>
          <div class="bp-meta">
            <span class="bp-chips">${p.chips}</span>
            ${roles.join('')}
          </div>
        </div>
      </div>`;
    }).join('');

    // Scroll so active player is vertically centred in the band
    const band      = document.getElementById('player-band');
    const bandH     = band.offsetHeight;
    const centerPos = bandH / 2 - ITEM_H / 2;
    const scrollIdx = phase === 'showdown' ? Math.floor(players.length / 2) : activeIdx;
    inner.style.transform = `translateY(${centerPos - scrollIdx * ITEM_H}px)`;

    // ── Bottom name banner ──
    if (phase === 'showdown') {
      labelEl.textContent = '⚔ Showdown ⚔';
      nameEl.textContent  = 'Showdown';
      nameEl.classList.add('showdown-text');
      bannerEl.style.display = 'flex';
    } else if (currentPlayer) {
      labelEl.textContent = 'Am Zug';
      nameEl.textContent  = currentPlayer.name;
      nameEl.classList.remove('showdown-text');
      bannerEl.style.display = 'flex';
    } else {
      bannerEl.style.display = 'none';
    }
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
