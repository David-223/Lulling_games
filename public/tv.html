<!DOCTYPE html>
<html lang="de" data-theme="ao">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920" />
  <title>TV – Lalling Games</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg-dark);
    }

    /* ── Animated background orbs ── */
    .tv-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .tv-bg::before,
    .tv-bg::after {
      content: '';
      position: absolute;
      border-radius: 50%;
    }

    .tv-bg::before {
      width: 60vw; height: 60vw;
      top: -20vw; left: -15vw;
      background: radial-gradient(circle,
        rgba(30,58,170,0.06) 0%, transparent 70%);
      animation: orb-drift 14s ease-in-out infinite alternate;
    }

    .tv-bg::after {
      width: 50vw; height: 50vw;
      bottom: -15vw; right: -10vw;
      background: radial-gradient(circle,
        rgba(100,0,200,0.05) 0%, transparent 70%);
      animation: orb-drift 18s ease-in-out infinite alternate-reverse;
    }

    @keyframes orb-drift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(3vw, 2vw) scale(1.06); }
    }

    .tv-scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px
      );
    }

    /* ── Header ── */
    .tv-header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 2.5rem 0.7rem;
      border-bottom: 1px solid var(--border-mid);
      background: linear-gradient(180deg, rgba(10,10,21,0.95) 0%, transparent 100%);
      flex-shrink: 0;
    }

    .tv-logo {
      font-family: var(--font-title);
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 24px rgba(201,162,39,0.55), 0 0 60px rgba(34,102,255,0.2);
      animation: logo-breathe 6s ease-in-out infinite;
    }

    @keyframes logo-breathe {
      0%,100% { text-shadow: 0 0 24px rgba(201,162,39,0.55), 0 0 60px rgba(34,102,255,0.2); }
      50%      { text-shadow: 0 0 40px rgba(201,162,39,0.75), 0 0 100px rgba(34,102,255,0.3); }
    }

    .tv-logo-sub {
      font-family: var(--font-ui);
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 0.2rem;
    }

    .tv-clock {
      font-family: var(--font-title);
      font-size: 1.6rem;
      letter-spacing: 0.12em;
      color: var(--text-mid);
    }

    /* ── 3-column body ── */
    .tv-body {
      position: relative;
      z-index: 10;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 0;
      overflow: hidden;
    }

    .tv-col {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--border-mid);
    }

    .tv-col:last-child { border-right: none; }

    .tv-col-header {
      flex-shrink: 0;
      padding: 0.55rem 1.2rem;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-mid);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tv-col-title {
      font-family: var(--font-ui);
      font-size: 0.6rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--p-glow);
      font-weight: 700;
    }

    .tv-col-count {
      font-family: var(--font-ui);
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.08em;
    }

    .tv-col-count span { color: var(--p-glow); font-weight: 700; }

    .tv-col-scroll {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 0.5rem 0.7rem;
      gap: 0.4rem;
    }

    /* ══════════════════ PLAYER COLUMN ══════════════════ */
    .tv-grid {
      display: grid;
      gap: 0.4rem;
      flex: 1;
      overflow: hidden;
      grid-auto-rows: 1fr;
    }

    .tv-card {
      background: var(--bg-card);
      border: 1px solid var(--border-mid);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    .tv-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--p);
    }

    .tv-card.rank-1 { border-color: var(--gold-dim); box-shadow: 0 0 10px rgba(201,162,39,0.12); }
    .tv-card.rank-1::before { background: var(--gold); }
    .tv-card.rank-2::before { background: #8090b0; }
    .tv-card.rank-3::before { background: #a06030; }
    .tv-card.eliminated::before { background: var(--border-mid); }

    .tv-card-inner {
      padding: 0.3rem 0.8rem 0.3rem 1rem;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .tv-card-top {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .tv-rank-badge {
      font-family: var(--font-title);
      font-size: 0.85rem;
      font-weight: 900;
      line-height: 1;
      min-width: 2.5rem;
      text-align: center;
      flex-shrink: 0;
      letter-spacing: 0.04em;
    }

    .tv-card.rank-1 .tv-rank-badge { color: var(--gold); text-shadow: 0 0 10px rgba(201,162,39,0.5); }
    .tv-card.rank-2 .tv-rank-badge { color: #aabbd0; }
    .tv-card.rank-3 .tv-rank-badge { color: #c07840; }
    .tv-card.eliminated .tv-rank-badge { color: var(--text-dim); }

    .tv-name-block { flex: 1; min-width: 0; }

    .tv-name {
      font-family: var(--font-title);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tv-card.eliminated .tv-name { color: var(--text-dim); text-decoration: line-through; }

    .tv-role {
      font-family: var(--font-ui);
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .tv-pts {
      font-family: var(--font-title);
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--p-glow);
      line-height: 1;
      flex-shrink: 0;
    }

    .tv-card.rank-1 .tv-pts { color: var(--gold); }
    .tv-card.eliminated .tv-pts { color: var(--text-dim); }

    .tv-bar-wrap {
      height: 2px;
      background: rgba(0,0,0,0.4);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 0.25rem;
    }

    .tv-bar {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--p), var(--p-glow));
      transition: width 1s ease;
    }

    .tv-card.rank-1 .tv-bar { background: linear-gradient(90deg, var(--gold-dim), var(--gold)); }
    .tv-card.eliminated .tv-bar { background: var(--border-mid); }

    .tv-elim-label {
      font-family: var(--font-ui);
      font-size: 0.58rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
      opacity: 0.5;
      padding: 0.3rem 0 0.1rem;
      border-top: 1px solid var(--border-mid);
    }

    /* ══════════════════ RULES COLUMN ══════════════════ */
    .rule-row {
      background: var(--bg-card);
      border: 1px solid var(--border-mid);
      border-left: 3px solid var(--p);
      border-radius: 4px;
      padding: 0.45rem 0.8rem;
      flex-shrink: 0;
    }

    .rule-row-num {
      font-family: var(--font-title);
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--p-glow);
      margin-bottom: 0.15rem;
    }

    .rule-row-title {
      font-family: var(--font-ui);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.15rem;
    }

    .rule-row-desc {
      font-family: var(--font-ui);
      font-size: 0.72rem;
      color: var(--text-dim);
      line-height: 1.4;
    }

    .rule-row-pts {
      font-family: var(--font-ui);
      font-size: 0.6rem;
      color: var(--gold-dim);
      margin-top: 0.2rem;
    }

    /* ══════════════════ HAND COLUMN ══════════════════ */
    .hand-row {
      background: var(--bg-card);
      border: 1px solid var(--border-mid);
      border-left: 3px solid var(--p-dim);
      border-radius: 4px;
      padding: 0.45rem 0.8rem;
      flex-shrink: 0;
    }

    .hand-row-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.15rem;
    }

    .hand-row-rank {
      font-family: var(--font-title);
      font-size: 0.58rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
    }

    .hand-row-name {
      font-family: var(--font-ui);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
    }

    .hand-row-cards {
      display: flex;
      gap: 0.2rem;
      margin-bottom: 0.2rem;
      flex-wrap: wrap;
    }

    .hcard {
      font-family: var(--font-ui);
      font-size: 0.6rem;
      font-weight: 700;
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
      border: 1px solid var(--border-mid);
      background: var(--bg-card2);
      color: var(--text-mid);
    }

    .hcard.red { color: #e05555; border-color: #3a1010; }

    .hand-row-rule {
      font-family: var(--font-ui);
      font-size: 0.72rem;
      color: var(--text-dim);
      line-height: 1.4;
    }

    /* ── Footer ── */
    .tv-footer {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 2.5rem;
      border-top: 1px solid var(--border-mid);
      flex-shrink: 0;
    }

    .tv-stat {
      font-family: var(--font-ui);
      font-size: 0.65rem;
      color: var(--text-dim);
      letter-spacing: 0.08em;
    }

    .tv-stat span { color: var(--p-glow); font-weight: 700; }

    .tv-refresh-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--p-glow);
      box-shadow: 0 0 6px var(--p-glow);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%,100% { opacity: 0.4; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.3); }
    }

    /* ══════════════════════════════════════
       POKER OVERLAY
    ══════════════════════════════════════ */
    #tv-poker-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--bg-dark);
      display: none;
      flex-direction: column;
    }

    .ptv-topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 2.5rem;
      border-bottom: 1px solid var(--border-mid);
      background: var(--bg-card);
    }

    .ptv-logo {
      font-family: var(--font-title);
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(201,162,39,0.5);
    }

    .ptv-phase-pill {
      font-family: var(--font-ui);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--p-glow);
      background: var(--p-bg);
      border: 1px solid var(--p-dim);
      border-radius: 99px;
      padding: 0.3rem 1.1rem;
    }

    .ptv-hand-badge {
      font-family: var(--font-ui);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    /* arena = everything below topbar */
    .ptv-arena {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* table container — seats are positioned inside here */
    .ptv-table-wrap {
      position: relative;
      width: 80vw;
      height: 72vh;
    }

    /* green oval */
    .ptv-oval {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 54%;
      aspect-ratio: 16 / 9;
      border-radius: 50%;
      background:
        radial-gradient(ellipse 55% 55% at 50% 42%,
          #3a8c4e 0%, #226038 50%, #142e1e 100%);
      border: 8px solid #3a1c06;
      box-shadow:
        0 0 0 3px #5c2e0a,
        inset 0 3px 18px rgba(0,0,0,0.5),
        0 10px 40px rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .ptv-center {
      text-align: center;
      pointer-events: none;
    }

    .ptv-pot-lbl {
      font-family: var(--font-ui);
      font-size: 0.55rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      font-weight: 700;
    }

    .ptv-pot-val {
      font-family: var(--font-title);
      font-size: 3rem;
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
      text-shadow: 0 0 30px rgba(201,162,39,0.6);
      transition: all 0.4s;
    }

    .ptv-pot-pts {
      font-family: var(--font-ui);
      font-size: 0.6rem;
      color: rgba(201,162,39,0.45);
      margin-bottom: 0.3rem;
    }

    .ptv-cur-bet {
      font-family: var(--font-ui);
      font-size: 0.65rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.1em;
    }

    /* player seat */
    .ptv-seat {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 13%;
      min-width: 120px;
      z-index: 2;
    }

    .ptv-seat-card {
      background: var(--bg-card);
      border: 2px solid var(--border-mid);
      border-radius: 8px;
      padding: 0.5rem 0.7rem;
      text-align: center;
      transition: border-color 0.3s, box-shadow 0.3s;
      position: relative;
    }

    /* active turn: glowing border */
    .ptv-seat.is-turn .ptv-seat-card {
      border-color: #88ee88;
      box-shadow: 0 0 16px rgba(100,220,100,0.5), 0 0 40px rgba(100,220,100,0.2);
    }

    .ptv-seat.is-folded .ptv-seat-card {
      opacity: 0.38;
    }

    .ptv-seat.is-allin .ptv-seat-card {
      border-color: var(--gold-dim);
    }

    .ptv-seat-name {
      font-family: var(--font-title);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ptv-seat.is-folded .ptv-seat-name { color: var(--text-dim); }
    .ptv-seat.is-turn   .ptv-seat-name { color: #88ee88; }

    .ptv-seat-chips {
      font-family: var(--font-ui);
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 0.1rem;
    }

    .ptv-seat-chips span {
      color: var(--p-glow);
      font-weight: 700;
    }

    .ptv-seat-bet {
      font-family: var(--font-title);
      font-size: 1rem;
      font-weight: 900;
      color: var(--gold);
      margin-top: 0.2rem;
    }

    .ptv-seat-bet.zero { visibility: hidden; }

    /* badges: D, SB, BB, FOLD, ALL-IN */
    .ptv-badges {
      display: flex;
      gap: 0.2rem;
      justify-content: center;
      margin-top: 0.25rem;
      flex-wrap: wrap;
    }

    .ptv-badge {
      font-family: var(--font-ui);
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .ptv-badge.dealer  { background: var(--gold); color: #000; }
    .ptv-badge.sb      { background: rgba(90,138,240,0.25); color: var(--p-glow); border: 1px solid var(--p-dim); }
    .ptv-badge.bb      { background: rgba(90,138,240,0.4);  color: var(--p-glow); border: 1px solid var(--p-dim); }
    .ptv-badge.fold    { background: rgba(100,100,120,0.3); color: var(--text-dim); }
    .ptv-badge.allin   { background: rgba(201,162,39,0.2);  color: var(--gold-dim); border: 1px solid var(--border-gold); }
    .ptv-badge.turn    { background: rgba(100,220,100,0.2); color: #88ee88; border: 1px solid rgba(100,220,100,0.4); }
    /* ══════════════════════════════════════
       FLAMES
    ══════════════════════════════════════ */
    .tv-flames {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 22vh;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    /* Base glow bloom */
    .tv-flames::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      height: 6vh;
      background: radial-gradient(ellipse 80% 100% at 50% 100%,
        rgba(180,30,0,0.45) 0%,
        rgba(120,10,0,0.25) 45%,
        transparent 75%);
      filter: blur(8px);
    }

    .flame-tongue {
      position: absolute;
      bottom: 0;
      transform-origin: bottom center;
      border-radius: 50% 50% 10% 10% / 80% 80% 20% 20%;
      will-change: transform, opacity;
    }

    /* Outer (dark red/crimson) layer */
    .flame-tongue.outer {
      background: linear-gradient(to top,
        #6b0000 0%,
        #c0200a 40%,
        #e84010 70%,
        transparent 100%);
      filter: blur(2px);
    }

    /* Mid (orange) layer */
    .flame-tongue.mid {
      background: linear-gradient(to top,
        #8c1c00 0%,
        #e05000 35%,
        #ff8800 65%,
        rgba(255,180,0,0.2) 90%,
        transparent 100%);
      filter: blur(1px);
    }

    /* Core (bright yellow/white) */
    .flame-tongue.core {
      background: linear-gradient(to top,
        #cc3300 0%,
        #ff6600 30%,
        #ffcc00 60%,
        rgba(255,240,150,0.3) 85%,
        transparent 100%);
      filter: blur(0.5px);
    }

    @keyframes flicker-a {
      0%   { transform: scaleY(1)    scaleX(1)    rotate(-1.5deg); opacity: 0.92; }
      20%  { transform: scaleY(1.08) scaleX(0.95) rotate(0.5deg);  opacity: 1;    }
      45%  { transform: scaleY(0.93) scaleX(1.04) rotate(2deg);    opacity: 0.88; }
      70%  { transform: scaleY(1.12) scaleX(0.92) rotate(-2deg);   opacity: 0.95; }
      100% { transform: scaleY(0.97) scaleX(1.02) rotate(1deg);    opacity: 0.9;  }
    }

    @keyframes flicker-b {
      0%   { transform: scaleY(1.04) scaleX(0.97) rotate(2deg);    opacity: 0.9;  }
      25%  { transform: scaleY(0.9)  scaleX(1.06) rotate(-1deg);   opacity: 1;    }
      55%  { transform: scaleY(1.15) scaleX(0.9)  rotate(1.5deg);  opacity: 0.85; }
      80%  { transform: scaleY(0.95) scaleX(1.02) rotate(-2.5deg); opacity: 0.95; }
      100% { transform: scaleY(1.06) scaleX(0.95) rotate(1deg);    opacity: 0.88; }
    }

    @keyframes flicker-c {
      0%   { transform: scaleY(0.95) scaleX(1.03) rotate(1deg);    opacity: 0.95; }
      30%  { transform: scaleY(1.1)  scaleX(0.93) rotate(-2deg);   opacity: 0.88; }
      60%  { transform: scaleY(0.88) scaleX(1.07) rotate(2.5deg);  opacity: 1;    }
      85%  { transform: scaleY(1.06) scaleX(0.96) rotate(-1deg);   opacity: 0.9;  }
      100% { transform: scaleY(0.98) scaleX(1.01) rotate(1.5deg);  opacity: 0.92; }
    }
    /* ══════════════════════════════════════
       DOMAIN EXPANSION OVERLAY
    ══════════════════════════════════════ */
    #tv-de-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #000;
      overflow: hidden;
    }

    #tv-de-overlay.visible { display: flex; }

    /* Shockwave ring */
    .de-shockwave {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .de-ring {
      position: absolute;
      border-radius: 50%;
      border: 3px solid var(--de-color, #5a8af0);
      opacity: 0;
      animation: de-ring-expand 1.8s ease-out forwards;
    }

    .de-ring:nth-child(1) { width: 10vw; height: 10vw; animation-delay: 0s; }
    .de-ring:nth-child(2) { width: 10vw; height: 10vw; animation-delay: 0.25s; }
    .de-ring:nth-child(3) { width: 10vw; height: 10vw; animation-delay: 0.5s; }

    @keyframes de-ring-expand {
      0%   { width: 5vw;  height: 5vw;  opacity: 0.9; border-width: 4px; }
      100% { width: 180vw; height: 180vw; opacity: 0; border-width: 1px; }
    }

    /* Flash burst */
    .de-flash {
      position: absolute;
      inset: 0;
      background: var(--de-color, #5a8af0);
      animation: de-flash-out 0.6s ease-out forwards;
    }

    @keyframes de-flash-out {
      0%   { opacity: 0.35; }
      100% { opacity: 0; }
    }

    /* Energy cracks radiating from centre */
    .de-cracks {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      animation: de-cracks-in 0.4s 0.1s ease-out forwards;
    }

    @keyframes de-cracks-in {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Main text block */
    .de-content {
      position: relative;
      z-index: 2;
      text-align: center;
      animation: de-content-rise 0.5s 0.2s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes de-content-rise {
      from { opacity: 0; transform: scale(0.85) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .de-kanji {
      font-family: var(--font-title);
      font-size: 12vw;
      font-weight: 900;
      color: var(--de-color, #5a8af0);
      line-height: 1;
      letter-spacing: 0.08em;
      text-shadow:
        0 0 40px var(--de-color, #5a8af0),
        0 0 120px var(--de-color, #5a8af0),
        0 0 200px rgba(0,0,0,0.4);
      animation: de-kanji-pulse 0.6s 0.3s ease-out both;
    }

    @keyframes de-kanji-pulse {
      0%   { letter-spacing: 0.4em; opacity: 0; }
      60%  { letter-spacing: 0.04em; opacity: 1; }
      100% { letter-spacing: 0.08em; opacity: 1; }
    }

    .de-subname {
      font-family: var(--font-ui);
      font-size: 2.2vw;
      font-weight: 700;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0.85;
      margin-top: 0.4rem;
      animation: de-fade-in 0.4s 0.6s ease both;
    }

    .de-caster {
      font-family: var(--font-ui);
      font-size: 1.1vw;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--de-color, #5a8af0);
      opacity: 0.65;
      margin-top: 0.6rem;
      animation: de-fade-in 0.4s 0.8s ease both;
    }

    .de-divider {
      width: 40vw;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--de-color, #5a8af0), transparent);
      margin: 1.5rem auto;
      animation: de-fade-in 0.4s 0.9s ease both;
    }

    .de-effect {
      font-family: var(--font-title);
      font-size: 2vw;
      color: var(--gold);
      letter-spacing: 0.06em;
      max-width: 70vw;
      line-height: 1.5;
      text-shadow: 0 0 20px rgba(201,162,39,0.4);
      animation: de-fade-in 0.5s 1s ease both;
    }

    @keyframes de-fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Whole overlay fade out at the end */
    .de-fade-out {
      animation: de-overlay-out 0.8s ease forwards !important;
    }

    @keyframes de-overlay-out {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    /* ── Domain-themed background on the poker overlay ── */
    #tv-poker-overlay {
      transition: background 1s ease;
    }

    #tv-poker-overlay.de-bg-ao {
      background: radial-gradient(ellipse 120% 80% at 50% 110%,
        rgba(30,58,170,0.35) 0%, rgba(10,10,30,0.95) 55%, #05050c 100%);
    }

    #tv-poker-overlay.de-bg-shuku {
      background: radial-gradient(ellipse 120% 80% at 50% 110%,
        rgba(140,28,28,0.45) 0%, rgba(20,5,5,0.95) 55%, #0c0404 100%);
    }

    #tv-poker-overlay.de-bg-yami {
      background: radial-gradient(ellipse 120% 80% at 50% 110%,
        rgba(85,34,160,0.4) 0%, rgba(10,0,18,0.95) 55%, #060009 100%);
    }

    #tv-poker-overlay.de-bg-kin {
      background: radial-gradient(ellipse 120% 80% at 50% 110%,
        rgba(138,110,26,0.38) 0%, rgba(15,12,0,0.95) 55%, #090700 100%);
    }

    /* ── Persistent domain banner ── */
    #ptv-de-banner {
      flex-shrink: 0;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 0.5rem 2.5rem;
      border-bottom: 1px solid var(--de-color, var(--border-mid));
      background: linear-gradient(90deg,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0.25) 50%,
        rgba(0,0,0,0) 100%);
      position: relative;
      overflow: hidden;
    }

    /* subtle colour wash behind the banner */
    #ptv-de-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        transparent 0%,
        color-mix(in srgb, var(--de-color, transparent) 12%, transparent) 50%,
        transparent 100%);
      pointer-events: none;
    }

    #ptv-de-banner.visible { display: flex; }

    .ptv-de-name {
      font-family: var(--font-title);
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: var(--de-color, var(--p-glow));
      text-shadow: 0 0 14px var(--de-color, var(--p-glow));
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ptv-de-sub {
      font-family: var(--font-ui);
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ptv-de-effect {
      flex: 1;
      font-family: var(--font-ui);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.3;
    }

    .ptv-de-divider {
      width: 1px;
      height: 1.8rem;
      background: var(--de-color, var(--border-mid));
      opacity: 0.35;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="tv-bg"></div>
  <div class="tv-scanlines"></div>

  <header class="tv-header">
    <div>
      <div class="tv-logo">Lalling Games</div>
      <div class="tv-logo-sub">呪術廻戦 · Das Culling Spiel · Das Trinkspiel</div>
    </div>
    <div class="tv-clock" id="tv-time"></div>
  </header>

  <div class="tv-body">

    <!-- ── LEFT: Players ── -->
    <div class="tv-col">
      <div class="tv-col-header">
        <span class="tv-col-title">⚔ Teilnehmer</span>
        <span class="tv-col-count">Aktiv: <span id="tv-active-count">—</span></span>
      </div>
      <div class="tv-col-scroll">
        <div class="tv-grid" id="tv-grid"></div>
      </div>
    </div>

    <!-- ── MIDDLE: Game rules ── -->
    <div class="tv-col">
      <div class="tv-col-header">
        <span class="tv-col-title">📜 Spielregeln</span>
        <span class="tv-col-count">Regeln: <span id="tv-rules-count">—</span></span>
      </div>
      <div class="tv-col-scroll" id="rules-col"></div>
    </div>

    <!-- ── RIGHT: Poker hand rules ── -->
    <div class="tv-col">
      <div class="tv-col-header">
        <span class="tv-col-title">🃏 Hände</span>
        <span class="tv-col-count">10 Hände</span>
      </div>
      <div class="tv-col-scroll" id="hands-col"></div>
    </div>

  </div>

  <footer class="tv-footer">
    <div class="tv-stat">— 術式発動 · Technique Activated —</div>
    <div class="tv-refresh-dot"></div>
    <div class="tv-stat">呪術廻戦 · Lalling Games</div>
  </footer>

  <!-- ═══ DOMAIN EXPANSION OVERLAY ═══ -->
  <div id="tv-de-overlay">
    <div class="de-flash" id="de-flash"></div>
    <div class="de-shockwave" id="de-shockwave"></div>
    <svg class="de-cracks" id="de-cracks" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="de-content">
      <div class="de-kanji"   id="de-kanji"></div>
      <div class="de-subname" id="de-subname"></div>
      <div class="de-caster"  id="de-caster"></div>
      <div class="de-divider"></div>
      <div class="de-effect"  id="de-effect"></div>
    </div>
  </div>

  <!-- ═══ FLAMES ═══ -->
  <div class="tv-flames" id="tv-flames"></div>

  <!-- ═══ POKER OVERLAY ═══ -->
  <div id="tv-poker-overlay">
    <div class="ptv-topbar">
      <div class="ptv-hand-badge" id="ptv-hand-badge">Hand —</div>
      <div class="ptv-logo">Lalling Games · Poker</div>
      <div class="ptv-phase-pill" id="ptv-phase-pill">—</div>
    </div>

    <!-- persistent domain banner -->
    <div id="ptv-de-banner">
      <div class="ptv-de-name" id="ptv-de-name"></div>
      <div class="ptv-de-sub"  id="ptv-de-sub"></div>
      <div class="ptv-de-divider"></div>
      <div class="ptv-de-effect" id="ptv-de-effect"></div>
      <div class="ptv-de-divider"></div>
      <div class="ptv-de-sub" id="ptv-de-caster"></div>
    </div>

    <div class="ptv-arena">
      <div class="ptv-table-wrap" id="ptv-table-wrap">
        <div class="ptv-oval">
          <div class="ptv-center">
            <div class="ptv-pot-lbl">Pot</div>
            <div class="ptv-pot-val" id="ptv-pot-val">0</div>
            <div class="ptv-pot-pts">Punkte</div>
            <div class="ptv-cur-bet" id="ptv-cur-bet"></div>
          </div>
        </div>
        <!-- seats injected by JS -->
      </div>
    </div>
  </div>

  <script>
    const ROLES = {
      'Jujutsu Zauberer':  '⚔',
      'Sonderklasse':      '★',
      'Verfluchter Geist': '👁',
      'Fluchnutzer':       '🔥',
      'Normaler Mensch':   '○',
    };

    const HANDS = [
      { id:'royal_flush',      rank:'Rang I',    name:'Royaler Flush',    en:'Royal Flush',
        cards:[{v:'A♠'},{v:'K♠'},{v:'Q♠'},{v:'J♠'},{v:'10♠'}],
        def:'Alle anderen trinken 5 Schlucke. Du bist unantastbar.' },
      { id:'straight_flush',   rank:'Rang II',   name:'Straight Flush',   en:'Straight Flush',
        cards:[{v:'9♥',r:1},{v:'8♥',r:1},{v:'7♥',r:1},{v:'6♥',r:1},{v:'5♥',r:1}],
        def:'Verteile 8 Schlucke frei auf beliebige Spieler.' },
      { id:'four_of_a_kind',   rank:'Rang III',  name:'Vierling',         en:'Four of a Kind',
        cards:[{v:'A♠'},{v:'A♥',r:1},{v:'A♦',r:1},{v:'A♣'},{v:'K♠'}],
        def:'Verteile 6 Schlucke frei. Du darfst eine Regel bestimmen.' },
      { id:'full_house',       rank:'Rang IV',   name:'Full House',       en:'Full House',
        cards:[{v:'K♠'},{v:'K♥',r:1},{v:'K♦',r:1},{v:'J♠'},{v:'J♥',r:1}],
        def:'Verteile 4 Schlucke und trink selbst 1 Schluck.' },
      { id:'flush',            rank:'Rang V',    name:'Flush',            en:'Flush',
        cards:[{v:'A♣'},{v:'J♣'},{v:'8♣'},{v:'6♣'},{v:'3♣'}],
        def:'Verteile 3 Schlucke frei.' },
      { id:'straight',         rank:'Rang VI',   name:'Straße',           en:'Straight',
        cards:[{v:'9♠'},{v:'8♥',r:1},{v:'7♦',r:1},{v:'6♣'},{v:'5♠'}],
        def:'Spieler links und rechts trinken je 2 Schlucke.' },
      { id:'three_of_a_kind',  rank:'Rang VII',  name:'Drilling',         en:'Three of a Kind',
        cards:[{v:'Q♠'},{v:'Q♥',r:1},{v:'Q♦',r:1},{v:'9♠'},{v:'4♥',r:1}],
        def:'Wähle einen Spieler aus – dieser trinkt 3 Schlucke.' },
      { id:'two_pair',         rank:'Rang VIII', name:'Zwei Paare',       en:'Two Pair',
        cards:[{v:'J♠'},{v:'J♥',r:1},{v:'8♦',r:1},{v:'8♣'},{v:'A♠'}],
        def:'Du trinkst 2 Schlucke.' },
      { id:'one_pair',         rank:'Rang IX',   name:'Ein Paar',         en:'One Pair',
        cards:[{v:'10♠'},{v:'10♥',r:1},{v:'A♦',r:1},{v:'K♣'},{v:'Q♠'}],
        def:'Du trinkst 1 Schluck.' },
      { id:'high_card',        rank:'Rang X',    name:'Höchste Karte',    en:'High Card',
        cards:[{v:'A♠'},{v:'J♦',r:1},{v:'9♣'},{v:'7♥',r:1},{v:'3♠'}],
        def:'Du trinkst 2 Schlucke. Pech gehabt.' },
    ];

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function toRoman(n) {
      const vals=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
      const syms=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
      let r='';
      for(let i=0;i<vals.length;i++) while(n>=vals[i]){r+=syms[i];n-=vals[i];}
      return r;
    }

    // clock
    function tickClock() {
      const d=new Date();
      document.getElementById('tv-time').textContent =
        String(d.getHours()).padStart(2,'0')+':'+
        String(d.getMinutes()).padStart(2,'0')+':'+
        String(d.getSeconds()).padStart(2,'0');
    }
    setInterval(tickClock, 1000);
    tickClock();

    // ── HANDS column (static, from localStorage) ──
    function renderHands() {
      const saved = JSON.parse(localStorage.getItem('poker-hand-rules') || '{}');
      const col = document.getElementById('hands-col');
      col.innerHTML = HANDS.map(h => {
        const rule = saved[h.id] !== undefined ? saved[h.id] : h.def;
        const cards = h.cards.map(c =>
          `<span class="hcard${c.r ? ' red' : ''}">${c.v}</span>`
        ).join('');
        return `
          <div class="hand-row">
            <div class="hand-row-header">
              <span class="hand-row-rank">${h.rank}</span>
              <span class="hand-row-name">${escHtml(h.name)}</span>
            </div>
            <div class="hand-row-cards">${cards}</div>
            <div class="hand-row-rule">${escHtml(rule)}</div>
          </div>`;
      }).join('');
    }

    // ── RULES column (live from API) ──
    const rulesNodeMap = new Map();

    function toRomanRules(n) { return toRoman(n); }

    function upsertRule(id, numeral, title, desc, pts) {
      const key = String(id);
      if (!rulesNodeMap.has(key)) {
        const el = document.createElement('div');
        el.className = 'rule-row';
        el.innerHTML = `
          <div class="rule-row-num">Regel ${numeral}</div>
          <div class="rule-row-title"></div>
          <div class="rule-row-desc"></div>
          ${pts != null ? `<div class="rule-row-pts"></div>` : ''}`;
        rulesNodeMap.set(key, el);
      }
      const el = rulesNodeMap.get(key);
      el.querySelector('.rule-row-num').textContent  = `Regel ${numeral}`;
      el.querySelector('.rule-row-title').textContent = title;
      el.querySelector('.rule-row-desc').textContent  = desc;
      const ptsEl = el.querySelector('.rule-row-pts');
      if (ptsEl) ptsEl.textContent = pts != null ? `− ${pts} Pts` : '';
      return el;
    }

    // ── PLAYERS column (live, no-flicker) ──
    const playerNodeMap = new Map();

    function rankClass(rank) {
      return rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'';
    }

    function upsertPlayer(player, rank, elim, maxPts) {
      const key = String(player.id);
      const pct  = !elim && maxPts>0 ? Math.min(100,Math.round(player.points/maxPts*100)) : 0;
      const rClass = elim ? 'eliminated' : rankClass(rank);
      const badge  = elim ? '—' : toRoman(rank);
      const icon   = ROLES[player.role] || '○';

      if (!playerNodeMap.has(key)) {
        const el = document.createElement('div');
        el.className = `tv-card ${rClass}`;
        el.innerHTML = `
          <div class="tv-card-inner">
            <div class="tv-card-top">
              <div class="tv-rank-badge">${badge}</div>
              <div class="tv-name-block">
                <div class="tv-name">${escHtml(player.name)}</div>
                <div class="tv-role">${icon} ${escHtml(player.role)}</div>
              </div>
              <div class="tv-pts">${player.points}</div>
            </div>
            <div class="tv-bar-wrap"><div class="tv-bar" style="width:${pct}%"></div></div>
          </div>`;
        playerNodeMap.set(key, el);
      } else {
        const el = playerNodeMap.get(key);
        el.className = `tv-card ${rClass}`;
        el.querySelector('.tv-rank-badge').textContent = badge;
        el.querySelector('.tv-pts').textContent = player.points;
        el.querySelector('.tv-bar').style.width = pct + '%';
      }
      return playerNodeMap.get(key);
    }

    async function loadData() {
      try {
        const [pRes, rRes] = await Promise.all([
          fetch('/api/players'),
          fetch('/api/rules')
        ]);
        const players = await pRes.json();
        const rules   = await rRes.json();

        // ── Players ──
        const sorted = [...players].sort((a,b) => b.points - a.points);
        const active = sorted.filter(p => p.points > 0);
        const elim   = sorted.filter(p => p.points <= 0);
        const maxPts = active.length ? active[0].points : 100;

        document.getElementById('tv-active-count').textContent = active.length;

        const grid = document.getElementById('tv-grid');
        const divKey = '__divider__';
        const desired = [];

        active.forEach((p,i) => desired.push(upsertPlayer(p, i+1, false, maxPts)));

        if (elim.length) {
          if (!playerNodeMap.has(divKey)) {
            const d = document.createElement('div');
            d.className = 'tv-elim-label';
            d.textContent = '✕ Ausgeschieden';
            playerNodeMap.set(divKey, d);
          }
          desired.push(playerNodeMap.get(divKey));
          elim.forEach(p => desired.push(upsertPlayer(p, 0, true, maxPts)));
        }

        const desiredSet = new Set(desired);
        [...grid.children].forEach(c => { if (!desiredSet.has(c)) grid.removeChild(c); });
        desired.forEach((node, i) => {
          if (grid.children[i] !== node) grid.insertBefore(node, grid.children[i] || null);
        });

        // Clean stale player keys
        const liveKeys = new Set([...active,...elim].map(p => String(p.id)));
        liveKeys.add(divKey);
        for (const k of playerNodeMap.keys()) {
          if (!liveKeys.has(k)) playerNodeMap.delete(k);
        }

        // ── Rules ──
        document.getElementById('tv-rules-count').textContent = rules.length;
        const rulesCol = document.getElementById('rules-col');
        const rDesired = rules.map((rule, idx) =>
          upsertRule(rule.id, toRoman(idx+1), rule.title, rule.description, rule.points)
        );
        const rSet = new Set(rDesired);
        [...rulesCol.children].forEach(c => { if (!rSet.has(c)) rulesCol.removeChild(c); });
        rDesired.forEach((node, i) => {
          if (rulesCol.children[i] !== node) rulesCol.insertBefore(node, rulesCol.children[i] || null);
        });
        const liveRuleKeys = new Set(rules.map(r => String(r.id)));
        for (const k of rulesNodeMap.keys()) {
          if (!liveRuleKeys.has(k)) rulesNodeMap.delete(k);
        }

      } catch (e) { /* silent — keep showing last data */ }
    }

    // ══════════════════════════════════════
    //  POKER VIEW
    // ══════════════════════════════════════

    const PHASE_LABELS = {
      preflop: 'Pre-Flop', flop: 'Flop',
      turn: 'Turn', river: 'River', showdown: 'Showdown'
    };

    const seatNodeMap = new Map();

    // Position on an ellipse: angle in radians, centre = (50%, 50%)
    // ax/ay are the semi-axes in %, extended a bit beyond the oval
    function seatPos(idx, total) {
      const ax = 47, ay = 44;
      const angle = -Math.PI / 2 + (2 * Math.PI * idx / total);
      return {
        left: 50 + ax * Math.cos(angle),
        top:  50 + ay * Math.sin(angle)
      };
    }

    function upsertSeat(player, idx, total, state) {
      const key  = String(player.id);
      const pos  = seatPos(idx, total);
      const isDealer  = idx === state.dealerIdx;
      const isSB      = idx === state.sbIdx;
      const isBB      = idx === state.bbIdx;
      const isTurn    = idx === state.currentPlayerIdx;
      const isFolded  = player.folded;
      const isAllIn   = player.allIn;

      let cls = 'ptv-seat';
      if (isTurn)   cls += ' is-turn';
      if (isFolded) cls += ' is-folded';
      if (isAllIn)  cls += ' is-allin';

      const badges = [];
      if (isDealer) badges.push('<span class="ptv-badge dealer">D</span>');
      if (isSB)     badges.push('<span class="ptv-badge sb">SB</span>');
      if (isBB)     badges.push('<span class="ptv-badge bb">BB</span>');
      if (isTurn)   badges.push('<span class="ptv-badge turn">Am Zug</span>');
      if (isFolded) badges.push('<span class="ptv-badge fold">Gefoldet</span>');
      if (isAllIn)  badges.push('<span class="ptv-badge allin">All-In</span>');

      if (!seatNodeMap.has(key)) {
        const el = document.createElement('div');
        el.innerHTML = `
          <div class="ptv-seat-card">
            <div class="ptv-seat-name">${escHtml(player.name)}</div>
            <div class="ptv-seat-chips">Chips: <span>${player.chips}</span></div>
            <div class="ptv-seat-bet ${player.roundBet === 0 ? 'zero' : ''}">${player.roundBet}</div>
            <div class="ptv-badges">${badges.join('')}</div>
          </div>`;
        el.className = cls;
        seatNodeMap.set(key, el);
      } else {
        const el = seatNodeMap.get(key);
        el.className = cls;
        el.querySelector('.ptv-seat-chips span').textContent = player.chips;
        const betEl = el.querySelector('.ptv-seat-bet');
        betEl.textContent = player.roundBet;
        betEl.className = 'ptv-seat-bet' + (player.roundBet === 0 ? ' zero' : '');
        el.querySelector('.ptv-badges').innerHTML = badges.join('');
      }

      const el = seatNodeMap.get(key);
      el.style.left = pos.left + '%';
      el.style.top  = pos.top  + '%';
      return el;
    }

    function renderPokerView(state) {
      const overlay = document.getElementById('tv-poker-overlay');
      const wrap    = document.getElementById('ptv-table-wrap');

      // Update header
      document.getElementById('ptv-phase-pill').textContent =
        PHASE_LABELS[state.phase] || state.phase;
      document.getElementById('ptv-hand-badge').textContent =
        'Hand ' + toRoman(state.handNum);
      document.getElementById('ptv-pot-val').textContent = state.pot;
      document.getElementById('ptv-cur-bet').textContent =
        state.currentBet > 0 ? 'Aktueller Einsatz: ' + state.currentBet : '';

      // Domain expansion background + persistent banner
      const de     = state.domainExpansion;
      const banner = document.getElementById('ptv-de-banner');
      overlay.classList.remove('de-bg-ao', 'de-bg-shuku', 'de-bg-yami', 'de-bg-kin');
      if (de) {
        const color = DE_COLORS[de.theme] || DE_COLORS.ao;
        overlay.style.setProperty('--de-color', color);
        overlay.classList.add('de-bg-' + (de.theme || 'ao'));
        document.getElementById('ptv-de-name').textContent   = de.name;
        document.getElementById('ptv-de-sub').textContent    = de.subname;
        document.getElementById('ptv-de-effect').textContent = de.effect;
        document.getElementById('ptv-de-caster').textContent = de.caster;
        banner.classList.add('visible');
      } else {
        overlay.style.removeProperty('--de-color');
        banner.classList.remove('visible');
      }

      // Upsert seats
      const players = state.players;
      const desired = players.map((p, i) => upsertSeat(p, i, players.length, state));

      // Sync DOM: keep the oval (first child), then seats
      const oval = wrap.querySelector('.ptv-oval');
      const desiredSet = new Set(desired);
      [...wrap.children].forEach(c => {
        if (c !== oval && !desiredSet.has(c)) wrap.removeChild(c);
      });
      desired.forEach(node => {
        if (!wrap.contains(node)) wrap.appendChild(node);
      });

      // Clean stale keys
      const liveIds = new Set(players.map(p => String(p.id)));
      for (const k of seatNodeMap.keys()) {
        if (!liveIds.has(k)) seatNodeMap.delete(k);
      }
    }

    let pokerActive = false;
    let lastDEHandNum = -1;

    // Domain expansion colour themes
    const DE_COLORS = {
      ao:    '#5a8af0',
      shuku: '#cc3535',
      yami:  '#9060d8',
      kin:   '#c9a227',
    };

    function showDomainExpansion(de) {
      const overlay = document.getElementById('tv-de-overlay');
      const color   = DE_COLORS[de.theme] || '#5a8af0';

      // Set CSS var so all children inherit the theme colour
      overlay.style.setProperty('--de-color', color);

      // Fill text
      document.getElementById('de-kanji').textContent   = de.name;
      document.getElementById('de-subname').textContent = de.subname;
      document.getElementById('de-caster').textContent  = de.caster;
      document.getElementById('de-effect').textContent  = de.effect;

      // Rebuild shockwave rings (re-trigger animation by replacing nodes)
      const sw = document.getElementById('de-shockwave');
      sw.innerHTML = '<div class="de-ring"></div><div class="de-ring"></div><div class="de-ring"></div>';
      sw.querySelectorAll('.de-ring').forEach(r => r.style.borderColor = color);

      // Draw SVG cracks
      const svg = document.getElementById('de-cracks');
      const cx = 960, cy = 540;
      let paths = '';
      for (let i = 0; i < 14; i++) {
        const angle = (i / 14) * Math.PI * 2;
        const len   = 350 + (Math.sin(i * 7.3) + 1) * 350;
        const sway1 = (Math.sin(i * 3.1) * 120);
        const sway2 = (Math.cos(i * 5.7) * 80);
        const ex = cx + Math.cos(angle) * len;
        const ey = cy + Math.sin(angle) * len;
        const mx = cx + Math.cos(angle + 0.3) * (len * 0.5) + sway1;
        const my = cy + Math.sin(angle + 0.3) * (len * 0.5) + sway2;
        paths += `<path d="M${cx},${cy} Q${mx},${my} ${ex},${ey}"
          stroke="${color}" stroke-width="${1 + Math.abs(Math.sin(i * 2.4))}"
          fill="none" opacity="${0.3 + Math.abs(Math.sin(i * 1.9)) * 0.4}"/>`;
      }
      svg.innerHTML = paths;

      // Reset flash
      const flash = document.getElementById('de-flash');
      flash.style.background = color;
      flash.style.animation = 'none';
      flash.offsetHeight; // reflow
      flash.style.animation = '';

      overlay.classList.remove('de-fade-out');
      overlay.classList.add('visible');

      // Auto-hide after 5s
      clearTimeout(overlay._hideTimer);
      overlay._hideTimer = setTimeout(() => {
        overlay.classList.add('de-fade-out');
        setTimeout(() => overlay.classList.remove('visible', 'de-fade-out'), 800);
      }, 5000);
    }

    async function pollPoker() {
      try {
        const res = await fetch('/api/poker/state');
        if (!res.ok) {
          setPokerView(false); return;
        }
        const state = await res.json();
        const active = state && state.phase && state.phase !== 'setup';
        setPokerView(active);
        if (active) {
          renderPokerView(state);
          // Trigger domain expansion overlay on new hand
          if (state.domainExpansion && state.handNum !== lastDEHandNum) {
            lastDEHandNum = state.handNum;
            showDomainExpansion(state.domainExpansion);
          }
        }
      } catch {
        setPokerView(false);
      }
    }

    function setPokerView(show) {
      const overlay  = document.getElementById('tv-poker-overlay');
      const mainBody = document.querySelector('.tv-body');
      const header   = document.querySelector('.tv-header');
      const footer   = document.querySelector('.tv-footer');
      if (show === pokerActive) return;
      pokerActive = show;
      overlay.style.display  = show ? 'flex' : 'none';
      mainBody.style.display = show ? 'none' : '';
      header.style.display   = show ? 'none' : '';
      footer.style.display   = show ? 'none' : '';
    }

    // ── Flame generator ──
    (function buildFlames() {
      const container = document.getElementById('tv-flames');
      const anims = ['flicker-a', 'flicker-b', 'flicker-c'];
      const count = 28; // number of tongue groups

      for (let i = 0; i < count; i++) {
        const pct = (i / (count - 1)) * 100;
        // randomish but deterministic per index
        const r = (Math.sin(i * 7.3 + 1.1) + 1) / 2;  // 0-1
        const r2 = (Math.sin(i * 3.7 + 2.4) + 1) / 2;

        const outerW  = 4  + r  * 5;    // 4–9 vw
        const outerH  = 10 + r2 * 12;   // 10–22 vh
        const midW    = outerW  * 0.6;
        const midH    = outerH  * 0.75;
        const coreW   = outerW  * 0.35;
        const coreH   = outerH  * 0.55;

        const dur1 = (0.55 + r  * 0.5).toFixed(2); // 0.55–1.05s
        const dur2 = (0.45 + r2 * 0.55).toFixed(2);
        const dur3 = (0.5  + r  * 0.45).toFixed(2);
        const del1 = (r  * 0.4).toFixed(2);
        const del2 = (r2 * 0.35).toFixed(2);
        const del3 = (r  * 0.25).toFixed(2);
        const anim = anims[i % 3];

        const layers = [
          { cls: 'outer', w: outerW, h: outerH, dur: dur1, del: del1 },
          { cls: 'mid',   w: midW,   h: midH,   dur: dur2, del: del2 },
          { cls: 'core',  w: coreW,  h: coreH,  dur: dur3, del: del3 },
        ];

        layers.forEach(l => {
          const el = document.createElement('div');
          el.className = `flame-tongue ${l.cls}`;
          el.style.cssText = `
            left: calc(${pct}% - ${l.w / 2}vw);
            width: ${l.w}vw;
            height: ${l.h}vh;
            animation: ${anim} ${l.dur}s ${l.del}s ease-in-out infinite alternate;
          `;
          container.appendChild(el);
        });
      }
    })();

    pollPoker();
    setInterval(pollPoker, 2000);

    renderHands();
    loadData();
    setInterval(loadData, 5000);

    const saved = localStorage.getItem('lalling-theme') || 'ao';
    document.documentElement.setAttribute('data-theme', saved);
  </script>
</body>
</html>
