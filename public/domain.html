<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Domain Expansion</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    /* ── Domain base ── */
    .domain {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    /* ══════════════════════════════
       1 · INFINITE VOID — Gojo
    ══════════════════════════════ */
    .domain-void {
      background: #000;
    }
    .domain-void::before {
      content: '';
      position: fixed; inset: 0;
      background:
        repeating-linear-gradient(0deg,   transparent, transparent 59px, rgba(120,200,255,0.07) 60px),
        repeating-linear-gradient(90deg,  transparent, transparent 59px, rgba(120,200,255,0.07) 60px);
      animation: void-grid 8s linear infinite;
    }
    .domain-void::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(160,220,255,0.12) 0%, transparent 70%);
      animation: void-pulse 4s ease-in-out infinite;
    }
    @keyframes void-grid  { from { transform: perspective(400px) rotateX(20deg) translateY(0); } to { transform: perspective(400px) rotateX(20deg) translateY(60px); } }
    @keyframes void-pulse { 0%,100%{ opacity:0.5 } 50%{ opacity:1 } }

    /* ══════════════════════════════
       2 · MALEVOLENT SHRINE — Sukuna
    ══════════════════════════════ */
    .domain-shrine {
      background: radial-gradient(ellipse at 50% 100%, #2a0000 0%, #0d0000 60%, #000 100%);
    }
    .domain-shrine::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 90%, rgba(200,20,20,0.25) 0%, transparent 70%);
      animation: shrine-flicker 2s ease-in-out infinite;
    }
    .domain-shrine::after {
      content: '';
      position: fixed; inset: -10%;
      background-image:
        radial-gradient(1px 40px at 20% 80%, rgba(255,50,50,0.4) 0%, transparent 100%),
        radial-gradient(1px 60px at 50% 90%, rgba(255,80,30,0.3) 0%, transparent 100%),
        radial-gradient(1px 30px at 80% 85%, rgba(255,40,40,0.4) 0%, transparent 100%),
        radial-gradient(1px 50px at 35% 75%, rgba(220,60,20,0.3) 0%, transparent 100%),
        radial-gradient(1px 45px at 65% 88%, rgba(255,30,30,0.35) 0%, transparent 100%);
      animation: shrine-flames 3s ease-in-out infinite alternate;
    }
    @keyframes shrine-flicker { 0%,100%{ opacity:0.6 } 50%{ opacity:1 } 75%{ opacity:0.4 } }
    @keyframes shrine-flames  { from{ transform: scaleY(1) translateY(0) } to{ transform: scaleY(1.1) translateY(-8px) } }

    /* ══════════════════════════════
       3 · CHIMERA SHADOW — Megumi
    ══════════════════════════════ */
    .domain-shadow {
      background: #050510;
    }
    .domain-shadow::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 50% 70% at 20% 50%, rgba(40,0,80,0.5) 0%, transparent 60%),
        radial-gradient(ellipse 50% 70% at 80% 50%, rgba(0,20,60,0.4) 0%, transparent 60%);
      animation: shadow-shift 6s ease-in-out infinite alternate;
    }
    .domain-shadow::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(80,0,160,0.04) 1deg, transparent 2deg);
      animation: shadow-rotate 20s linear infinite;
    }
    @keyframes shadow-shift  { from{ transform: scale(1) } to{ transform: scale(1.1) translateX(5%) } }
    @keyframes shadow-rotate { from{ transform: rotate(0deg) } to{ transform: rotate(360deg) } }

    /* ══════════════════════════════
       4 · SELF-EMBODIMENT — Mahito
    ══════════════════════════════ */
    .domain-mahito {
      background: radial-gradient(ellipse at 50% 50%, #1a0820 0%, #080008 100%);
    }
    .domain-mahito::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 30% 60% at 30% 40%, rgba(180,40,120,0.15) 0%, transparent 70%),
        radial-gradient(ellipse 30% 60% at 70% 60%, rgba(100,20,180,0.15) 0%, transparent 70%);
      animation: mahito-warp 5s ease-in-out infinite;
    }
    .domain-mahito::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-radial-gradient(ellipse at 50% 50%, transparent 0px, transparent 40px, rgba(180,40,120,0.05) 41px, transparent 42px);
      animation: mahito-pulse 3s ease-in-out infinite;
    }
    @keyframes mahito-warp  { 0%,100%{ transform: scale(1) } 50%{ transform: scale(1.05) skewX(1deg) } }
    @keyframes mahito-pulse { 0%,100%{ opacity:0.5 } 50%{ opacity:1 } }

    /* ══════════════════════════════
       5 · HORIZON — Geto
    ══════════════════════════════ */
    .domain-geto {
      background: radial-gradient(ellipse at 50% 30%, #0a001a 0%, #000308 100%);
    }
    .domain-geto::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 20% at 50% 50%, rgba(100,60,200,0.2) 0%, transparent 100%);
      animation: geto-float 6s ease-in-out infinite;
    }
    .domain-geto::after {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(2px 2px at 20% 30%, rgba(180,140,255,0.6) 0%, transparent 100%),
        radial-gradient(2px 2px at 60% 20%, rgba(180,140,255,0.5) 0%, transparent 100%),
        radial-gradient(2px 2px at 80% 50%, rgba(140,100,255,0.4) 0%, transparent 100%),
        radial-gradient(2px 2px at 40% 70%, rgba(200,160,255,0.5) 0%, transparent 100%),
        radial-gradient(2px 2px at 10% 60%, rgba(160,120,255,0.4) 0%, transparent 100%),
        radial-gradient(2px 2px at 70% 80%, rgba(180,140,255,0.3) 0%, transparent 100%);
      animation: geto-stars 8s ease-in-out infinite alternate;
    }
    @keyframes geto-float { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-10px) } }
    @keyframes geto-stars { from{ opacity:0.4 } to{ opacity:1 } }

    /* ══════════════════════════════
       6 · WOMB PROFUSION — Dagon
    ══════════════════════════════ */
    .domain-dagon {
      background: radial-gradient(ellipse at 50% 100%, #001a2e 0%, #000a14 100%);
    }
    .domain-dagon::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 100% 30% at 50% 100%, rgba(0,80,140,0.4) 0%, transparent 100%);
      animation: dagon-wave 4s ease-in-out infinite;
    }
    .domain-dagon::after {
      content: '';
      position: fixed; inset: 0;
      background:
        repeating-linear-gradient(180deg, transparent, transparent 29px, rgba(0,120,200,0.06) 30px);
      animation: dagon-current 6s linear infinite;
    }
    @keyframes dagon-wave    { 0%,100%{ transform: scaleX(1) } 50%{ transform: scaleX(1.05) } }
    @keyframes dagon-current { from{ transform: translateY(0) } to{ transform: translateY(30px) } }

    /* ══════════════════════════════
       7 · MOON PALACE — Tengen
    ══════════════════════════════ */
    .domain-tengen {
      background: radial-gradient(ellipse at 50% 0%, #1a1200 0%, #080600 100%);
    }
    .domain-tengen::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 40% 40% at 50% 20%, rgba(255,200,60,0.15) 0%, transparent 70%),
        repeating-conic-gradient(from 0deg at 50% 20%, transparent 0deg, rgba(255,180,40,0.03) 10deg, transparent 20deg);
      animation: tengen-spin 30s linear infinite;
    }
    .domain-tengen::after {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 20% 20% at 50% 20%, rgba(255,220,100,0.2) 0%, transparent 100%);
      animation: tengen-glow 4s ease-in-out infinite;
    }
    @keyframes tengen-spin { from{ transform: rotate(0deg) } to{ transform: rotate(360deg) } }
    @keyframes tengen-glow { 0%,100%{ opacity:0.5 } 50%{ opacity:1 } }

    /* ══════════════════════════════
       8 · DEADLY SENTENCING — Naoya
    ══════════════════════════════ */
    .domain-naoya {
      background: #020202;
    }
    .domain-naoya::before {
      content: '';
      position: fixed; inset: 0;
      background:
        linear-gradient(180deg, rgba(180,160,0,0.08) 0%, transparent 30%),
        linear-gradient(0deg,   rgba(180,160,0,0.08) 0%, transparent 30%);
      animation: naoya-scan 2s linear infinite;
    }
    .domain-naoya::after {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(1px 100vh at 15% 0%, rgba(200,180,0,0.3) 0%, transparent 100%),
        radial-gradient(1px 100vh at 40% 0%, rgba(200,180,0,0.15) 0%, transparent 100%),
        radial-gradient(1px 100vh at 70% 0%, rgba(200,180,0,0.25) 0%, transparent 100%),
        radial-gradient(1px 100vh at 90% 0%, rgba(200,180,0,0.2) 0%, transparent 100%);
      animation: naoya-strike 4s ease-in-out infinite;
    }
    @keyframes naoya-scan   { from{ transform: translateY(-100%) } to{ transform: translateY(100%) } }
    @keyframes naoya-strike { 0%,90%,100%{ opacity:0 } 92%,98%{ opacity:1 } }

    /* ══════════════════════════════
       9 · DER WANDELNDE BARNABAS — Shanon
    ══════════════════════════════ */
    .domain-barnabas {
      background: radial-gradient(ellipse at 40% 60%, #0a0a00 0%, #000000 100%);
    }
    .domain-barnabas::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 30% 70%, rgba(80,60,0,0.25) 0%, transparent 70%),
        radial-gradient(ellipse 40% 60% at 70% 30%, rgba(60,40,0,0.2) 0%, transparent 70%);
      animation: barnabas-shift 7s ease-in-out infinite alternate;
    }
    .domain-barnabas::after {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(1px 1px at 15% 25%, rgba(180,150,0,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 15%, rgba(160,130,0,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 40%, rgba(180,140,0,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 65%, rgba(140,110,0,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 75%, rgba(160,130,0,0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 80%, rgba(180,150,0,0.3) 0%, transparent 100%);
      animation: barnabas-flicker 5s ease-in-out infinite;
    }
    @keyframes barnabas-shift   { from{ transform: scale(1) } to{ transform: scale(1.08) translateX(-3%) } }
    @keyframes barnabas-flicker { 0%,100%{ opacity:0.4 } 30%{ opacity:1 } 60%{ opacity:0.6 } 80%{ opacity:0.9 } }

    /* ── Content overlay ── */
    .domain-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      user-select: none;
    }

    .expansion-label {
      font-size: 0.55rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      opacity: 0.5;
      margin-bottom: 0.5rem;
    }

    .domain-jp {
      font-size: clamp(2rem, 10vw, 3.5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.1em;
      text-shadow: 0 0 40px currentColor;
      animation: name-breathe 4s ease-in-out infinite;
    }
    @keyframes name-breathe { 0%,100%{ text-shadow: 0 0 40px currentColor } 50%{ text-shadow: 0 0 80px currentColor, 0 0 120px currentColor } }

    .domain-en {
      font-size: clamp(0.8rem, 3vw, 1.1rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 0.75rem;
    }

    .domain-separator {
      width: 60px;
      height: 1px;
      background: currentColor;
      opacity: 0.3;
      margin: 0.5rem 0;
    }

    .domain-desc {
      font-size: clamp(0.75rem, 2.5vw, 0.9rem);
      opacity: 0.45;
      letter-spacing: 0.15em;
      font-style: italic;
    }

    .player-label {
      position: fixed;
      bottom: 2.5rem;
      left: 0; right: 0;
      text-align: center;
      z-index: 10;
    }
    .player-label-name {
      font-size: clamp(1rem, 4vw, 1.4rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      opacity: 0.7;
    }
    .player-label-role {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.3;
      margin-top: 0.2rem;
    }

    /* ── Activation HUD ── */
    .domain-hud {
      position: fixed;
      bottom: 7rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(90vw, 360px);
      background: rgba(0,0,0,0.72);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      backdrop-filter: blur(8px);
    }

    .hud-coins {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      opacity: 0.8;
    }

    .hud-coin-icon {
      font-size: 1rem;
    }

    .hud-coin-count {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .hud-status {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      opacity: 0.6;
      text-align: center;
      line-height: 1.4;
    }

    .hud-status.status-active {
      opacity: 1;
      color: #7fff7f;
    }

    .hud-status.status-blocked {
      opacity: 1;
      color: #ffaa44;
    }

    .hud-btn {
      width: 100%;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: opacity 0.15s, transform 0.1s;
    }

    .hud-btn:active { transform: scale(0.97); }
    .hud-btn:disabled { opacity: 0.35; cursor: default; transform: none; }

    .hud-btn-activate {
      background: currentColor;
      color: #000;
    }

    .hud-btn-cancel {
      background: rgba(255,60,60,0.18);
      border: 1px solid rgba(255,80,80,0.4);
      color: #ff8080;
    }

    /* ── Nav overlay ── */
    .domain-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.5rem 1rem;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-wrap: wrap;
    }
    .domain-nav a {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      transition: color 0.2s;
    }
    .domain-nav a:hover { color: rgba(255,255,255,0.85); }
    .domain-nav .nav-logo {
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      margin-right: auto;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
    }

    /* ── Not logged in ── */
    .not-logged {
      position: fixed; inset: 0;
      background: #050505;
      color: #444;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }
    .not-logged a {
      color: #666;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <nav class="domain-nav">
    <span class="nav-logo">Lalling Games</span>
    <a href="index.html">Regeln</a>
    <a href="poker.html">Hände</a>
    <a href="gluecksrad.html">Gamble</a>
    <a href="poker-game.html">Poker</a>
    <a href="lobby.html">Anmelden</a>
    <a href="spieler.html">Spieler</a>
    <a href="knuggeliges-rad.html">☠ Knuggeliges Rad</a>
  </nav>

  <div class="not-logged" id="not-logged" style="display:none">
    <div>Keine Domain gefunden.</div>
    <a href="lobby.html">Zur Lobby →</a>
  </div>

  <div class="domain" id="domain" style="display:none">
    <div class="domain-content">
      <div class="expansion-label" id="expansion-label">Domain Expansion</div>
      <div class="domain-jp"   id="domain-jp"></div>
      <div class="domain-en"   id="domain-en"></div>
      <div class="domain-separator"></div>
      <div class="domain-desc" id="domain-desc"></div>
    </div>

    <!-- Activation HUD -->
    <div class="domain-hud" id="domain-hud">
      <div class="hud-coins">
        <span class="hud-coin-icon">🪙</span>
        <span>Domain-Münzen:</span>
        <span class="hud-coin-count" id="hud-coin-count">—</span>
      </div>
      <div class="hud-status" id="hud-status">Lädt…</div>
      <button class="hud-btn hud-btn-activate" id="hud-activate-btn" disabled>Domain aktivieren (1 Münze)</button>
      <button class="hud-btn hud-btn-cancel"   id="hud-cancel-btn"   style="display:none">Aktivierung aufheben</button>
    </div>

    <div class="player-label">
      <div class="player-label-name" id="player-name"></div>
      <div class="player-label-role" id="player-role"></div>
    </div>
  </div>

  <script>
    const DOMAINS = [
      {
        cls: 'domain-void', jp: '無量空処', en: 'Infinite Void',
        desc: 'Alles. Nichts. Unendlichkeit.',
        color: '#a0dcff', theme: 'ao', caster: 'Gojo Satoru',
        expansionId: 'infinite_void',
      },
      {
        cls: 'domain-shrine', jp: '伏魔御廚子', en: 'Malevolent Shrine',
        desc: 'Zerstörung kennt keine Grenzen.',
        color: '#ff6060', theme: 'shuku', caster: 'Ryomen Sukuna',
        expansionId: 'malevolent_shrine',
      },
      {
        cls: 'domain-shadow', jp: '嵌合暗翳庭', en: 'Chimera Shadow Garden',
        desc: 'Schatten verschlingen alles.',
        color: '#9d60ff', theme: 'yami', caster: 'Fushiguro Megumi',
        expansionId: 'chimera_shadow',
      },
      {
        cls: 'domain-mahito', jp: '自閉円頓裹', en: 'Self-Embodiment of Perfection',
        desc: 'Die Seele verformt sich nach deinem Willen.',
        color: '#e060c0', theme: 'shuku', caster: 'Mahito',
        expansionId: 'self_embodiment',
      },
      {
        cls: 'domain-geto', jp: '嶄新な慄き', en: 'Horizon of the Captivating Skandha',
        desc: 'Zwischen den Welten schweben.',
        color: '#b49fff', theme: 'yami', caster: 'Geto Suguru',
        expansionId: 'horizon_captivating',
      },
      {
        cls: 'domain-dagon', jp: '蕩蕩跋扈魑魅魍魎', en: 'Womb Profusion',
        desc: 'Tiefe ohne Ende.',
        color: '#40a0e0', theme: 'ao', caster: 'Dagon',
        expansionId: null,
      },
      {
        cls: 'domain-tengen', jp: '無為転変', en: 'Idle Death Gamble',
        desc: 'Ewiges Licht übersteigt jeden Fluch.',
        color: '#ffd060', theme: 'kin', caster: 'Tengen',
        expansionId: null,
      },
      {
        cls: 'domain-naoya', jp: '死刑宣告', en: 'Deadly Sentencing',
        desc: 'Das Urteil ist unausweichlich.',
        color: '#c8c020', theme: 'kin', caster: 'Naoya Zenin',
        expansionId: null,
      },
      {
        cls: 'domain-barnabas', jp: 'Der wandelnde Barnabas', en: 'The Wandering Barnabas',
        desc: 'Barnabas sieht alles. Barnabas spricht nicht.',
        color: '#b8a020', theme: 'yami', caster: 'Shanon',
        expansionId: 'wandelnder_barnabas',
      },
    ];

    function getMe() {
      try { return JSON.parse(localStorage.getItem('lalling-me')); } catch { return null; }
    }

    let myDomain = null;
    let allExpansions = [];

    async function init() {
      let me = getMe();
      if (!me) {
        document.getElementById('not-logged').style.display = '';
        return;
      }

      // Always fetch fresh player data so domainIdx is up to date
      try {
        const r = await fetch('/api/players');
        if (r.ok) {
          const players = await r.json();
          const fresh = players.find(p => p.id === me.id);
          if (fresh && fresh.domainIdx !== undefined) {
            me = { ...me, domainIdx: fresh.domainIdx };
            localStorage.setItem('lalling-me', JSON.stringify(me));
          }
        }
      } catch {}

      const domainIdx = (me.domainIdx !== undefined) ? me.domainIdx % DOMAINS.length : me.id % DOMAINS.length;
      myDomain = DOMAINS[domainIdx];

      // Load expansion effects from server
      try {
        const r = await fetch('/api/domain-expansion');
        if (r.ok) { const d = await r.json(); allExpansions = d.expansions || []; }
      } catch {}

      const domainEl = document.getElementById('domain');
      domainEl.classList.add(myDomain.cls);
      domainEl.style.color = myDomain.color;
      domainEl.style.display = '';

      document.getElementById('domain-jp').textContent   = myDomain.jp;
      document.getElementById('domain-en').textContent   = myDomain.en;
      document.getElementById('domain-desc').textContent = myDomain.desc;
      document.getElementById('player-name').textContent = me.name;
      document.getElementById('player-role').textContent = me.role || '';
      document.title = myDomain.en + ' — ' + me.name;

      // Button style uses domain color
      document.getElementById('hud-activate-btn').style.background = myDomain.color;

      // Wire up buttons
      document.getElementById('hud-activate-btn').addEventListener('click', activateDomain);
      document.getElementById('hud-cancel-btn').addEventListener('click', cancelDomain);

      // Start polling
      await pollStatus();
      setInterval(pollStatus, 3000);
    }

    async function pollStatus() {
      const me = getMe();
      if (!me) return;
      try {
        const r = await fetch('/api/domain-activation?playerId=' + me.id);
        if (!r.ok) return;
        const data = await r.json();
        updateHUD(me, data);
      } catch {}
    }

    function buildDomainObj() {
      if (!myDomain) return null;
      const expansion = myDomain.expansionId
        ? allExpansions.find(e => e.id === myDomain.expansionId)
        : null;
      return {
        id:      myDomain.expansionId || myDomain.cls,
        name:    myDomain.jp,
        subname: myDomain.en,
        caster:  myDomain.caster,
        theme:   myDomain.theme,
        effect:  expansion ? expansion.effect : myDomain.desc,
      };
    }

    async function activateDomain() {
      const me = getMe();
      if (!me) return;
      const domainObj = buildDomainObj();
      if (!domainObj) return;

      const btn = document.getElementById('hud-activate-btn');
      btn.disabled = true;
      try {
        const r = await fetch('/api/domain-activation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playerId: me.id, domain: domainObj }),
        });
        const data = await r.json();
        if (!r.ok) { alert(data.error || 'Fehler'); btn.disabled = false; return; }
        updateHUD(me, data);
      } catch { btn.disabled = false; }
    }

    async function cancelDomain() {
      const me = getMe();
      if (!me) return;
      const btn = document.getElementById('hud-cancel-btn');
      btn.disabled = true;
      try {
        const r = await fetch('/api/domain-activation', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playerId: me.id }),
        });
        const data = await r.json();
        if (!r.ok) { alert(data.error || 'Fehler'); btn.disabled = false; return; }
        updateHUD(me, data);
      } catch { btn.disabled = false; }
    }

    function updateHUD(me, data) {
      const coins        = data.myCoins ?? 0;
      const pending      = data.pending;
      const isMyPending  = pending && pending.playerId === me.id;
      const someoneElse  = pending && !isMyPending;

      document.getElementById('hud-coin-count').textContent = coins;

      const statusEl = document.getElementById('hud-status');
      const activateBtn = document.getElementById('hud-activate-btn');
      const cancelBtn   = document.getElementById('hud-cancel-btn');

      if (isMyPending) {
        statusEl.textContent = '⚡ Deine Domain ist für die nächste Hand aktiviert!';
        statusEl.className   = 'hud-status status-active';
        activateBtn.style.display = 'none';
        cancelBtn.style.display   = '';
        cancelBtn.disabled = false;
      } else if (someoneElse) {
        statusEl.textContent = '🔒 ' + pending.playerName + ' hat bereits eine Domain aktiviert.';
        statusEl.className   = 'hud-status status-blocked';
        activateBtn.style.display = '';
        activateBtn.disabled = true;
        cancelBtn.style.display = 'none';
      } else {
        statusEl.textContent = 'Keine Domain aktiviert — du kannst deine für die nächste Hand einsetzen.';
        statusEl.className   = 'hud-status';
        activateBtn.style.display = '';
        activateBtn.disabled = coins < 1;
        cancelBtn.style.display = 'none';
      }
    }

    init();
  </script>
</body>
</html>
