<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Poker – Lalling Games</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Phase bar ── */
    .phase-bar {
      display: flex;
      justify-content: center;
      gap: 0;
      margin: 1.2rem 0 1rem;
      border: 1px solid var(--border-mid);
      border-radius: 4px;
      overflow: hidden;
    }
    .phase-step {
      flex: 1;
      padding: 0.4rem 0.2rem;
      text-align: center;
      font-family: var(--font-ui);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      background: var(--bg-card);
      border-right: 1px solid var(--border-mid);
      transition: background 0.3s, color 0.3s;
    }
    .phase-step:last-child { border-right: none; }
    .phase-step.active { background: var(--p-bg); color: var(--p-glow); }
    .phase-step.done   { background: transparent; color: var(--text-dim); opacity: 0.4; }

    /* ── Pot display ── */
    .pot-display {
      text-align: center;
      margin-bottom: 1rem;
    }
    .pot-label {
      font-size: 0.62rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-family: var(--font-ui);
      font-weight: 700;
    }
    .pot-value {
      font-family: var(--font-title);
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 0.05em;
      line-height: 1.1;
    }
    .pot-value span { font-size: 1rem; color: var(--gold-dim); }

    /* ── Player rows ── */
    .player-rows { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }

    .player-row {
      background: var(--bg-card);
      border: 1px solid var(--border-mid);
      border-radius: 5px;
      display: flex;
      align-items: center;
      padding: 0.6rem 0.8rem;
      gap: 0.6rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .player-row.active-turn {
      border-color: var(--p);
      box-shadow: 0 0 10px var(--p-bg);
    }
    .player-row.folded-row { opacity: 0.35; }

    .player-row .pr-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--p-bg);
      border: 1px solid var(--p-dim);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-title);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--p-glow);
      flex-shrink: 0;
    }
    .player-row .pr-name {
      flex: 1;
      font-family: var(--font-ui);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }
    .player-row.active-turn .pr-name { color: var(--p-glow); }

    .player-row .pr-chips {
      font-family: var(--font-ui);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gold);
      min-width: 50px;
      text-align: right;
    }
    .player-row .pr-bet {
      font-family: var(--font-ui);
      font-size: 0.72rem;
      color: var(--text-dim);
      min-width: 36px;
      text-align: right;
    }

    .pr-badges { display: flex; gap: 0.3rem; flex-wrap: wrap; justify-content: flex-end; }
    .pr-badge {
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.1rem 0.4rem;
      border-radius: 2px;
      font-weight: 700;
      border: 1px solid;
      white-space: nowrap;
    }
    .badge-dealer { color: var(--gold); border-color: var(--border-gold); background: rgba(201,162,39,0.08); }
    .badge-sb     { color: #6cf; border-color: #1a4466; background: rgba(100,200,255,0.07); }
    .badge-bb     { color: #adf; border-color: #1a2a44; background: rgba(150,200,255,0.07); }
    .badge-folded { color: var(--text-dim); border-color: var(--border-mid); background: transparent; }
    .badge-allin  { color: #f84; border-color: #663300; background: rgba(255,130,60,0.1); }
    .badge-you    { color: var(--p-glow); border-color: var(--p-dim); background: var(--p-bg); }
    .badge-turn   { color: #4f4; border-color: #1a441a; background: rgba(80,220,80,0.1); animation: blink 1s infinite; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── Action panel ── */
    .action-panel {
      background: var(--bg-card);
      border: 1px solid var(--p);
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: 0 0 12px var(--p-bg);
    }
    .action-title {
      font-family: var(--font-ui);
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--p-glow);
      font-weight: 700;
      margin-bottom: 0.8rem;
    }
    .action-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 0.7rem;
    }
    .action-btns .btn { font-size: 0.82rem; padding: 0.55rem 0.5rem; }
    .btn-fold   { background: rgba(180,30,30,0.15); border-color: #551010; color: #f66; }
    .btn-fold:hover { background: rgba(180,30,30,0.3); }
    .btn-check  { }
    .btn-call   { background: var(--p-bg); }
    .btn-allin  { background: rgba(255,130,60,0.12); border-color: #663300; color: #f84; grid-column: 1 / -1; }
    .btn-allin:hover { background: rgba(255,130,60,0.25); }

    .raise-row {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }
    .raise-input {
      flex: 1;
      background: var(--bg-card2);
      border: 1px solid var(--border-mid);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 0.9rem;
      padding: 0.45rem 0.6rem;
      outline: none;
      min-width: 0;
    }
    .raise-input:focus { border-color: var(--p); }
    .raise-presets {
      display: flex;
      gap: 0.3rem;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }
    .raise-preset {
      background: var(--bg-card2);
      border: 1px solid var(--border-mid);
      border-radius: 3px;
      color: var(--text-dim);
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
    }
    .raise-preset:hover { border-color: var(--p); color: var(--p-glow); }

    /* ── Control panel (advance + winner) ── */
    .control-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-mid);
      border-radius: 6px;
      padding: 0.9rem 1rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .control-label {
      font-family: var(--font-ui);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 700;
    }

    /* ── Winner select ── */
    .winner-select {
      background: var(--bg-card2);
      border: 1px solid var(--border-mid);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 0.9rem;
      padding: 0.5rem 0.7rem;
      outline: none;
      width: 100%;
    }
    .winner-select:focus { border-color: var(--gold); }

    /* ── Setup card ── */
    .setup-card {
      background: var(--bg-card);
      border: 1px solid var(--border-mid);
      border-radius: 6px;
      padding: 1.4rem 1.2rem;
      margin-top: 1.5rem;
    }
    .setup-card h3 {
      font-family: var(--font-ui);
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--p-glow);
      font-weight: 700;
      margin-bottom: 1rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border-mid);
    }
    .blind-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
      margin-bottom: 1rem;
    }
    .blind-group label {
      display: block;
      font-family: var(--font-ui);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 700;
      margin-bottom: 0.3rem;
    }
    .blind-group input {
      width: 100%;
      background: var(--bg-card2);
      border: 1px solid var(--border-mid);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 1rem;
      font-weight: 700;
      padding: 0.5rem 0.7rem;
      outline: none;
      box-sizing: border-box;
    }
    .blind-group input:focus { border-color: var(--p); }

    .setup-players {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1rem;
      max-height: 200px;
      overflow-y: auto;
    }
    .setup-player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.7rem;
      background: var(--bg-card2);
      border: 1px solid var(--border-mid);
      border-radius: 4px;
      font-family: var(--font-ui);
      font-size: 0.85rem;
    }
    .setup-player-chips { color: var(--gold); font-weight: 700; font-size: 0.78rem; }

    /* ── Hand result banner ── */
    .hand-result {
      background: rgba(26,107,58,0.1);
      border: 1px solid #1a6b3a;
      border-radius: 6px;
      padding: 1rem;
      text-align: center;
      margin-bottom: 1rem;
    }
    .hand-result .winner-name {
      font-family: var(--font-title);
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 0.05em;
    }
    .hand-result p { font-family: var(--font-ui); font-size: 0.82rem; color: var(--text-dim); margin-top: 0.3rem; }

    /* ── Status line ── */
    .status-line {
      text-align: center;
      padding: 0.5rem;
      font-family: var(--font-ui);
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }
    .status-line .dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--p-glow);
      margin-right: 0.4rem;
      animation: pulse 1.5s infinite;
    }

    /* ── No game screen ── */
    .no-game {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim);
      font-family: var(--font-ui);
    }
    .no-game .icon { font-size: 2.5rem; margin-bottom: 0.8rem; opacity: 0.4; }
    .no-game p { margin-bottom: 1.2rem; font-size: 0.88rem; }

    .section-sep {
      height: 1px;
      background: var(--border-mid);
      margin: 1rem 0;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="logo-text">Lalling Games</div>
    <div class="logo-sub">Das Culling Spiel · Das Trinkspiel</div>
    <nav class="nav-links">
      <a href="index.html">Regeln</a>
      <a href="lobby.html">Lobby</a>
      <a href="gluecksrad.html">Gamble</a>
      <a href="poker-game.html" class="active">Poker</a>
      <div class="nav-dropdown">
        <button class="nav-dropdown-btn" id="nav-more-btn">Mehr ▾</button>
        <div class="nav-dropdown-menu" id="nav-more-menu">
          <a href="poker.html">Hände</a>
          <a href="spieler.html">Spieler</a>
          <a href="admin.html">Admin</a>
        </div>
      </div>
    </nav>
    <div class="theme-switcher" id="theme-switcher">
      <button class="theme-btn" data-scheme="ao"    title="蒼 – Gojo Blue"></button>
      <button class="theme-btn" data-scheme="shuku" title="赫 – Sukuna Crimson"></button>
      <button class="theme-btn" data-scheme="yami"  title="闇 – Hollow Purple"></button>
      <button class="theme-btn" data-scheme="kin"   title="金 – Special Grade"></button>
    </div>
  </header>

  <main>
    <div id="view-nogame" style="display:none">
      <div class="no-game">
        <div class="icon">🃏</div>
        <p>Kein laufendes Spiel.<br>Starte eine neue Runde unten.</p>
      </div>
      <div class="setup-card" id="setup-card">
        <h3>⚔ Neue Pokerrunde</h3>
        <div class="blind-row">
          <div class="blind-group">
            <label>Small Blind</label>
            <input id="blind-small" type="number" min="1" value="5" />
          </div>
          <div class="blind-group">
            <label>Big Blind</label>
            <input id="blind-big" type="number" min="2" value="10" />
          </div>
        </div>
        <div class="setup-players" id="setup-players">Lade Spieler…</div>
        <button class="btn btn-primary btn-full" id="start-game-btn">Spiel starten</button>
      </div>
    </div>

    <div id="view-game" style="display:none">
      <!-- Phase bar -->
      <div class="phase-bar" id="phase-bar">
        <div class="phase-step" data-phase="preflop">Pre-Flop</div>
        <div class="phase-step" data-phase="flop">Flop</div>
        <div class="phase-step" data-phase="turn">Turn</div>
        <div class="phase-step" data-phase="river">River</div>
        <div class="phase-step" data-phase="showdown">Showdown</div>
      </div>

      <!-- Pot -->
      <div class="pot-display">
        <div class="pot-label">Pot</div>
        <div class="pot-value" id="pot-value">0 <span>Pts</span></div>
      </div>

      <!-- Status -->
      <div class="status-line" id="status-line"></div>

      <!-- Players -->
      <div class="player-rows" id="player-rows"></div>

      <!-- My action panel -->
      <div class="action-panel" id="action-panel" style="display:none">
        <div class="action-title">⚡ Dein Zug</div>
        <div class="action-btns">
          <button class="btn btn-fold"  id="act-fold">Fold</button>
          <button class="btn btn-check" id="act-check">Check</button>
          <button class="btn btn-call"  id="act-call">Call</button>
          <button class="btn btn-secondary" id="act-raise-btn">Raise</button>
        </div>
        <div class="raise-row">
          <input class="raise-input" id="raise-amount" type="number" min="1" placeholder="Raise auf…" />
          <button class="btn btn-secondary" id="act-raise-confirm">↑ Raise</button>
        </div>
        <div class="raise-presets" id="raise-presets"></div>
        <div class="action-btns" style="margin-top:0.5rem">
          <button class="btn btn-allin" id="act-allin">All-In</button>
        </div>
      </div>

      <!-- Control panel -->
      <div class="control-panel" id="control-panel" style="display:none">
        <div class="control-label" id="control-label"></div>
        <button class="btn btn-primary btn-full" id="advance-btn" style="display:none">
          Weiter → nächste Karten aufdecken
        </button>
        <div id="winner-section" style="display:none">
          <select class="winner-select" id="winner-select">
            <option value="">— Gewinner wählen —</option>
          </select>
          <button class="btn btn-primary btn-full" id="winner-btn" style="margin-top:0.5rem">
            Pot vergeben
          </button>
        </div>
      </div>

      <!-- Hand result -->
      <div class="hand-result" id="hand-result" style="display:none">
        <div class="winner-name" id="result-name"></div>
        <p id="result-text"></p>
        <div style="display:flex;gap:0.5rem;margin-top:0.8rem;justify-content:center">
          <button class="btn btn-primary" id="next-hand-btn">Nächste Hand</button>
          <button class="btn btn-secondary" id="end-game-btn">Spiel beenden</button>
        </div>
      </div>

      <!-- Setup new game while in game -->
      <div class="section-sep"></div>
      <button class="btn btn-danger btn-full" id="end-game-btn2" style="margin-bottom:1rem">
        Spiel beenden &amp; Chips speichern
      </button>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    // ── Identity ──
    function getMe() { try { return JSON.parse(localStorage.getItem('lalling-me')); } catch { return null; } }
    function setMe(p) { localStorage.setItem('lalling-me', JSON.stringify(p)); }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'show' + (type ? ' ' + type : '');
      clearTimeout(t._t);
      t._t = setTimeout(() => { t.className = ''; }, 2800);
    }

    // ── State ──
    let game = null;
    let pollTimer = null;

    const PHASE_ORDER = ['preflop', 'flop', 'turn', 'river', 'showdown'];
    const PHASE_LABEL = { preflop: 'Pre-Flop', flop: 'Flop', turn: 'Turn', river: 'River', showdown: 'Showdown', ended: 'Beendet', setup: 'Setup' };

    // ── Render ──
    function render(g) {
      if (!g || g.phase === 'setup') { showNoGame(); return; }
      showGame();
      game = g;

      // Phase bar
      document.querySelectorAll('.phase-step').forEach(el => {
        const ph = el.dataset.phase;
        const idx = PHASE_ORDER.indexOf(ph);
        const cur = PHASE_ORDER.indexOf(g.phase);
        el.className = 'phase-step' + (ph === g.phase ? ' active' : idx < cur ? ' done' : '');
      });

      // Pot
      document.getElementById('pot-value').innerHTML = `${g.pot} <span>Pts</span>`;

      // Status
      const statusEl = document.getElementById('status-line');
      if (g.currentPlayerIdx >= 0 && g.players[g.currentPlayerIdx]) {
        const cp = g.players[g.currentPlayerIdx];
        statusEl.innerHTML = `<span class="dot"></span>Zug: <strong>${escHtml(cp.name)}</strong>`;
      } else if (g.phase === 'showdown' || g.phase === 'ended') {
        statusEl.innerHTML = `<span class="dot" style="background:var(--gold)"></span>${PHASE_LABEL[g.phase]}`;
      } else if (g.toAct.length === 0 && ['preflop','flop','turn','river'].includes(g.phase)) {
        statusEl.innerHTML = `<span class="dot" style="background:#4f4"></span>Bettingrunde beendet — Karten aufdecken`;
      } else {
        statusEl.innerHTML = '';
      }

      // Players
      const rowsEl = document.getElementById('player-rows');
      const me = getMe();
      rowsEl.innerHTML = g.players.map((p, i) => {
        const isMe = me && p.id === me.id;
        const isTurn = i === g.currentPlayerIdx;
        const badges = [];
        if (i === g.dealerIdx && !['ended','setup'].includes(g.phase)) badges.push('<span class="pr-badge badge-dealer">D</span>');
        if (i === g.sbIdx && g.phase !== 'ended') badges.push('<span class="pr-badge badge-sb">SB</span>');
        if (i === g.bbIdx && g.phase !== 'ended') badges.push('<span class="pr-badge badge-bb">BB</span>');
        if (isMe) badges.push('<span class="pr-badge badge-you">Du</span>');
        if (isTurn) badges.push('<span class="pr-badge badge-turn">am Zug</span>');
        if (p.folded) badges.push('<span class="pr-badge badge-folded">Fold</span>');
        if (p.allIn) badges.push('<span class="pr-badge badge-allin">All-In</span>');

        return `<div class="player-row${isTurn ? ' active-turn' : ''}${p.folded ? ' folded-row' : ''}">
          <div class="pr-avatar">${escHtml(p.name.charAt(0).toUpperCase())}</div>
          <div class="pr-name">${escHtml(p.name)}</div>
          <div class="pr-bet">${p.roundBet > 0 ? '+' + p.roundBet : ''}</div>
          <div class="pr-chips">${p.chips} Pts</div>
          <div class="pr-badges">${badges.join('')}</div>
        </div>`;
      }).join('');

      // Action panel (only show if it's my turn)
      const actionPanel = document.getElementById('action-panel');
      const myIdx = me ? g.players.findIndex(p => p.id === me.id) : -1;
      const isMyTurn = myIdx >= 0 && g.currentPlayerIdx === myIdx && ['preflop','flop','turn','river'].includes(g.phase);
      actionPanel.style.display = isMyTurn ? '' : 'none';

      if (isMyTurn) {
        const me_p = g.players[myIdx];
        const toCall = g.currentBet - me_p.roundBet;
        const canCheck = toCall === 0;
        const checkBtn = document.getElementById('act-check');
        const callBtn  = document.getElementById('act-call');
        checkBtn.style.display = canCheck ? '' : 'none';
        callBtn.style.display  = canCheck ? 'none' : '';
        if (!canCheck) callBtn.textContent = `Call ${toCall}`;

        // Raise input & presets
        document.getElementById('raise-amount').min = g.currentBet + 1;
        document.getElementById('raise-amount').placeholder = `Raise auf (min. ${g.currentBet + 1})`;

        const bb = g.blindBig;
        const presets = [bb * 2, bb * 3, bb * 5, bb * 10].filter(v => v > g.currentBet && v <= me_p.chips + me_p.roundBet);
        document.getElementById('raise-presets').innerHTML = presets.map(v =>
          `<button class="raise-preset" onclick="setRaise(${v})">${v}</button>`
        ).join('') + `<button class="raise-preset" onclick="setRaise(${me_p.chips + me_p.roundBet})">All-In (${me_p.chips + me_p.roundBet})</button>`;
      }

      // Control panel
      const controlPanel = document.getElementById('control-panel');
      const advanceBtn    = document.getElementById('advance-btn');
      const winnerSection = document.getElementById('winner-section');
      const handResult    = document.getElementById('hand-result');

      handResult.style.display = 'none';
      controlPanel.style.display = 'none';
      advanceBtn.style.display = 'none';
      winnerSection.style.display = 'none';

      if (g.phase === 'ended') {
        handResult.style.display = '';
        document.getElementById('result-name').textContent = g.winner || '?';
        document.getElementById('result-text').textContent = `Hat den Pot gewonnen!`;
      } else if (g.phase === 'showdown') {
        controlPanel.style.display = '';
        winnerSection.style.display = '';
        document.getElementById('control-label').textContent = 'Showdown — wer hat gewonnen?';
        const sel = document.getElementById('winner-select');
        const activePlayers = g.players.filter(p => !p.folded);
        sel.innerHTML = '<option value="">— Gewinner wählen —</option>' +
          activePlayers.map(p => `<option value="${p.id}">${escHtml(p.name)} (${p.chips} Pts)</option>`).join('');
      } else if (g.toAct.length === 0 && g.currentPlayerIdx === -1 && ['preflop','flop','turn','river'].includes(g.phase)) {
        const nextPhaseLabel = PHASE_LABEL[PHASE_ORDER[PHASE_ORDER.indexOf(g.phase) + 1]] || '';
        controlPanel.style.display = '';
        document.getElementById('control-label').textContent = `Bettingrunde beendet`;
        advanceBtn.style.display = '';
        advanceBtn.textContent = g.phase === 'river'
          ? 'Weiter → Showdown'
          : `Weiter → ${nextPhaseLabel} aufdecken`;
      }
    }

    function showNoGame() {
      document.getElementById('view-nogame').style.display = '';
      document.getElementById('view-game').style.display = 'none';
      loadSetupPlayers();
    }
    function showGame() {
      document.getElementById('view-nogame').style.display = 'none';
      document.getElementById('view-game').style.display = '';
    }

    // ── Setup ──
    async function loadSetupPlayers() {
      const el = document.getElementById('setup-players');
      try {
        const res = await fetch('/api/players');
        const players = await res.json();
        if (!players.length) { el.innerHTML = '<p style="color:var(--text-dim);font-size:0.82rem;font-family:var(--font-ui)">Keine Spieler. Zuerst Lobby starten.</p>'; return; }
        el.innerHTML = players.map(p =>
          `<div class="setup-player"><span>${escHtml(p.name)}</span><span class="setup-player-chips">${p.points} Pts</span></div>`
        ).join('');
      } catch { el.innerHTML = '<p style="color:var(--text-dim)">Fehler</p>'; }
    }

    document.getElementById('start-game-btn').addEventListener('click', async () => {
      const bs = parseInt(document.getElementById('blind-small').value) || 5;
      const bb = parseInt(document.getElementById('blind-big').value) || 10;
      if (bs >= bb) { showToast('Big Blind muss größer als Small Blind sein', 'error'); return; }
      try {
        const res = await fetch('/api/poker/new', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ blindSmall: bs, blindBig: bb })
        });
        const data = await res.json();
        if (!res.ok) { showToast(data.error || 'Fehler', 'error'); return; }
        // Immediately deal first hand
        await dealHand();
      } catch { showToast('Verbindungsfehler', 'error'); }
    });

    async function dealHand() {
      try {
        const res = await fetch('/api/poker/deal', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        const data = await res.json();
        if (!res.ok) { showToast(data.error || 'Fehler', 'error'); return; }
        render(data);
        startPolling();
      } catch { showToast('Verbindungsfehler', 'error'); }
    }

    // ── Actions ──
    async function sendAction(action, amount) {
      const me = getMe();
      if (!me) { showToast('Nicht angemeldet', 'error'); return; }
      try {
        const res = await fetch('/api/poker/action', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playerId: me.id, action, amount })
        });
        const data = await res.json();
        if (!res.ok) { showToast(data.error || 'Fehler', 'error'); return; }
        render(data);
      } catch { showToast('Verbindungsfehler', 'error'); }
    }

    document.getElementById('act-fold').addEventListener('click', () => sendAction('fold'));
    document.getElementById('act-check').addEventListener('click', () => sendAction('check'));
    document.getElementById('act-call').addEventListener('click', () => sendAction('call'));
    document.getElementById('act-allin').addEventListener('click', () => sendAction('allin'));
    document.getElementById('act-raise-confirm').addEventListener('click', () => {
      const v = parseInt(document.getElementById('raise-amount').value);
      if (!v) { showToast('Betrag eingeben', 'error'); return; }
      sendAction('raise', v);
    });
    document.getElementById('raise-amount').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('act-raise-confirm').click();
    });

    function setRaise(v) {
      document.getElementById('raise-amount').value = v;
    }

    // ── Advance phase ──
    document.getElementById('advance-btn').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/poker/advance', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        const data = await res.json();
        if (!res.ok) { showToast(data.error || 'Fehler', 'error'); return; }
        render(data);
      } catch { showToast('Verbindungsfehler', 'error'); }
    });

    // ── Declare winner ──
    document.getElementById('winner-btn').addEventListener('click', async () => {
      const winnerId = document.getElementById('winner-select').value;
      if (!winnerId) { showToast('Gewinner auswählen', 'error'); return; }
      try {
        const res = await fetch('/api/poker/winner', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ winnerId: parseInt(winnerId) })
        });
        const data = await res.json();
        if (!res.ok) { showToast(data.error || 'Fehler', 'error'); return; }
        stopPolling();
        render(data);
        // Refresh lalling-me chips
        const me = getMe();
        if (me) {
          const winner = data.players.find(p => p.id === me.id);
          if (winner) setMe({ ...me, points: winner.chips });
        }
      } catch { showToast('Verbindungsfehler', 'error'); }
    });

    // ── Next hand ──
    document.getElementById('next-hand-btn').addEventListener('click', dealHand);

    // ── End game ──
    async function endGame() {
      if (!confirm('Spiel beenden? Chips werden als Punkte gespeichert.')) return;
      stopPolling();
      try {
        await fetch('/api/poker/end', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        game = null;
        showNoGame();
        showToast('Spiel beendet. Punkte gespeichert.');
      } catch { showToast('Verbindungsfehler', 'error'); }
    }
    document.getElementById('end-game-btn').addEventListener('click', endGame);
    document.getElementById('end-game-btn2').addEventListener('click', endGame);

    // ── Polling ──
    async function poll() {
      try {
        const res = await fetch('/api/poker/state');
        if (res.status === 404) { stopPolling(); showNoGame(); return; }
        const data = await res.json();
        if (!data || data.phase === 'setup') { stopPolling(); showNoGame(); return; }
        if (data.phase !== 'ended') render(data);
      } catch {}
    }
    function startPolling() { stopPolling(); pollTimer = setInterval(poll, 1500); }
    function stopPolling()  { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

    // ── Auto-identity from lobby ──
    (async () => {
      try {
        const raw = localStorage.getItem('lalling-lobby');
        if (raw) {
          const session = JSON.parse(raw);
          if (session.name) {
            const res = await fetch('/api/players');
            const players = await res.json();
            const p = players.find(p => p.name.toLowerCase() === session.name.toLowerCase());
            if (p) setMe({ id: p.id, name: p.name, points: p.points });
          }
        }
      } catch {}

      // Try to load existing game
      try {
        const res = await fetch('/api/poker/state');
        if (res.ok) {
          const data = await res.json();
          if (data && !['setup'].includes(data.phase)) {
            render(data);
            if (!['ended'].includes(data.phase)) startPolling();
            return;
          }
        }
      } catch {}
      showNoGame();
    })();

    // ── Theme ──
    const THEMES = ['ao', 'shuku', 'yami', 'kin'];
    function applyTheme(scheme) {
      if (!THEMES.includes(scheme)) scheme = 'ao';
      document.documentElement.setAttribute('data-theme', scheme);
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.scheme === scheme));
      localStorage.setItem('lalling-theme', scheme);
    }
    document.getElementById('theme-switcher').addEventListener('click', e => {
      const btn = e.target.closest('.theme-btn');
      if (btn) applyTheme(btn.dataset.scheme);
    });
    applyTheme(localStorage.getItem('lalling-theme') || 'ao');

    // ── Dropdown ──
    (function() {
      const btn  = document.getElementById('nav-more-btn');
      const menu = document.getElementById('nav-more-menu');
      if (!btn) return;
      btn.addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('open'); });
      document.addEventListener('click', () => menu.classList.remove('open'));
    })();
  </script>
</body>
</html>
