<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Gamble – Lalling Games</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Wheel container ── */
    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .wheel-wrap {
      position: relative;
      display: inline-block;
    }

    /* Pointer triangle at the top */
    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 22px solid var(--p-glow);
      filter: drop-shadow(0 0 6px var(--p-glow));
      z-index: 2;
      transition: border-top-color 0.5s, filter 0.5s;
    }

    #wheel {
      display: block;
      border-radius: 50%;
      filter: drop-shadow(0 0 10px var(--p-glow)) drop-shadow(0 0 28px var(--p-bg));
      transition: filter 0.5s;
    }

    /* ── Spin button ── */
    .spin-btn {
      font-size: 1.05rem;
      letter-spacing: 0.2em;
      padding: 0.9rem 2.5rem;
      clip-path: polygon(14px 0%, calc(100% - 14px) 0%, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0% 50%);
      transition: background 0.3s, box-shadow 0.3s, opacity 0.3s;
    }

    .spin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── Result panel ── */
    .result-panel {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--p-dim);
      border-top: 2px solid var(--p-glow);
      border-radius: 8px;
      padding: 1.5rem 1.3rem 1.3rem;
      text-align: center;
      width: 100%;
      animation: result-appear 0.4s ease;
      box-shadow: 0 0 30px var(--p-bg), 0 8px 24px rgba(0,0,0,0.6);
    }

    .result-panel.visible { display: block; }

    @keyframes result-appear {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    .result-label {
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--p-glow);
      font-family: var(--font-ui);
      font-weight: 700;
      margin-bottom: 0.7rem;
      opacity: 0.85;
    }

    .result-text {
      font-family: var(--font-title);
      font-size: 1.3rem;
      color: var(--gold);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.3;
      margin-bottom: 1rem;
      text-shadow: 0 0 20px rgba(201,162,39,0.4);
    }

    /* ── Entries ── */
    .entries-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.8rem;
    }

    .entry-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      background: var(--bg-card);
      border: 1px solid var(--border-mid);
      border-left: 3px solid var(--p-dim);
      border-radius: 0 3px 3px 0;
      padding: 0.55rem 0.8rem 0.55rem 1rem;
      transition: border-color 0.5s, background 0.5s;
    }

    .entry-item:hover {
      border-left-color: var(--p-glow);
    }

    .entry-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .entry-name {
      flex: 1;
      font-size: 1rem;
      color: var(--text-mid);
      font-family: var(--font-body);
    }

    .entries-empty {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.92rem;
      font-family: var(--font-ui);
      padding: 1.5rem 0 0.5rem;
    }

    .entries-count {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-family: var(--font-ui);
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
      text-align: right;
    }

    .entries-count span {
      color: var(--p-glow);
      font-weight: 700;
    }

    /* Import from rules button */
    .import-btn {
      font-size: 0.8rem;
      padding: 0.45rem 1rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="logo-text">Lalling Games</div>
    <div class="logo-sub">Das Culling Spiel · Das Trinkspiel</div>
    <nav class="nav-links">
      <a href="index.html">Regeln</a>
      <a href="poker.html">Hände</a>
      <a href="gluecksrad.html" class="active">Gamble</a>
      <a href="poker-game.html">Poker</a>
      <div class="nav-dropdown">
        <button class="nav-dropdown-btn" id="nav-more-btn">Mehr ▾</button>
        <div class="nav-dropdown-menu" id="nav-more-menu">
          <a href="lobby.html">Anmelden</a>
          <a href="spieler.html">Spieler</a>
          <a href="binding-vows.html">Binding Vows</a>
          <a href="admin.html">Admin</a>
            <a href="domain.html">Domain</a>
            <a href="brainrot.html">Brainrot</a>
            <a href="knuggeliges-rad.html">☠ Knuggeliges Rad</a>
        </div>
      </div>
    </nav>
    <div class="theme-switcher" id="theme-switcher">
      <button class="theme-btn" data-scheme="ao"    title="蒼 – Gojo Blue"></button>
      <button class="theme-btn" data-scheme="shuku" title="赫 – Sukuna Crimson"></button>
      <button class="theme-btn" data-scheme="yami"  title="闇 – Hollow Purple"></button>
      <button class="theme-btn" data-scheme="kin"   title="金 – Special Grade"></button>
    </div>
  </header>

  <main>
    <h2 class="section-title">Gamble</h2>

    <!-- Wheel -->
    <div class="wheel-section">
      <div class="wheel-wrap">
        <div class="wheel-pointer" id="pointer"></div>
        <canvas id="wheel" width="320" height="320"></canvas>
      </div>

      <button class="btn btn-primary spin-btn" id="spin-btn" onclick="spin()">
        ⚔ Drehen
      </button>

      <!-- Spin counter -->
      <div id="spin-counter-box" style="display:flex;align-items:center;gap:0.6rem;margin-top:0.5rem;">
        <button class="btn btn-secondary" style="padding:0.25rem 0.7rem;font-size:1rem;" onclick="changeSpins(-1)">−</button>
        <div style="font-family:var(--font-ui);font-size:0.82rem;letter-spacing:0.1em;color:var(--text-dim);min-width:7rem;text-align:center;">
          Drehungen: <span id="spins-left" style="color:var(--gold);font-weight:700;">1</span>
        </div>
        <button class="btn btn-secondary" style="padding:0.25rem 0.7rem;font-size:1rem;" onclick="changeSpins(1)">+</button>
      </div>

      <div id="no-spin-msg" style="display:none; font-size:0.82rem; color:var(--text-dim); font-family:var(--font-ui); letter-spacing:0.08em; margin-top:0.3rem;">
        Nur Admins dürfen drehen
      </div>
    </div>

    <!-- Result -->
    <div class="result-panel" id="result-panel">
      <div class="result-label">— 術式発動 · Ergebnis —</div>
      <div class="result-text" id="result-text"></div>
      <button class="btn btn-secondary" onclick="closeResult()">Schließen</button>
    </div>

    <!-- Add Entry -->
    <div class="form-card" style="margin-top:1.5rem;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
        <h2 class="section-title" style="margin:0; border:none; padding:0;">Einträge</h2>
        <button class="btn btn-secondary import-btn" onclick="importRules()" title="Regeln aus dem Spiel importieren">
          ↓ Regeln importieren
        </button>
      </div>
      <div class="form-group">
        <label for="new-entry">Neuer Eintrag</label>
        <input type="text" id="new-entry" placeholder="z.B. Jeder trinkt 2 Schlucke" autocapitalize="sentences" maxlength="60" />
      </div>
      <button class="btn btn-primary btn-full" onclick="addEntry()">+ Hinzufügen</button>
    </div>

    <div class="entries-count">Einträge: <span id="entries-count">0</span></div>
    <div id="entries-list" class="entries-list"></div>
  </main>

  <div id="toast"></div>

  <script>
    // ── State ──
    const DOMAIN_COIN_ENTRY = '🪙 +1 Domain-Münze';

    function getMe() {
      try { return JSON.parse(localStorage.getItem('lalling-me')); } catch { return null; }
    }

    const DEFAULT_ENTRIES = [
      DOMAIN_COIN_ENTRY,
      'Punkte werden verdoppelt',
      'Verteile 1 Shot deiner Wahl',
      'Bestimme einen Hurensohn für die nächste Hand',
      'Verteile 8 Schlücke',
      'Ozan ist ein Affe',
      'Alle 2 Schlücke',
      'Du darfst eine Regel hinzufügen',
      'Beantworte eine Frage sonst 1 Shot',
      'Trinke 3 Schlücke',
      'Du musst für eine Runde die Fresse halten (2 Strafschlücke)',
      '3 Hände schwerbehinderter T-Rex',
      '1 Hand Lachen verboten',
      'Dreh noch 2 mal',
    ];
    let entries = [];
    let currentAngle = 0;
    let spinning = false;
    let spinsLeft = 1;

    function updateSpinCounter() {
      document.getElementById('spins-left').textContent = spinsLeft;
      document.getElementById('spin-btn').disabled = spinsLeft <= 0 || spinning;
      document.getElementById('spin-btn').textContent = spinsLeft <= 0 ? '— Keine Drehungen mehr —' : '⚔ Drehen';
    }

    function changeSpins(delta) {
      spinsLeft = Math.max(0, Math.min(10, spinsLeft + delta));
      updateSpinCounter();
    }

    // ── Segment colours ──
    // Generated from the theme's primary colour family
    // Segment fill colours — dark enough to contrast text, hue-tinted per theme
    const SEG_PALETTES = [
      // ao – alternating deep navy / midnight blue
      ['#080f22', '#0c1430', '#06091a', '#0f1a3c', '#04060e'],
      // shuku – alternating deep crimson / dark wine
      ['#1e0808', '#280a0a', '#140506', '#320c0c', '#0e0404'],
      // yami – alternating deep violet / near-black purple
      ['#0f0020', '#160030', '#08001a', '#1c003a', '#050010'],
      // kin – alternating deep amber / dark ochre
      ['#181000', '#221800', '#100c00', '#2c2000', '#080600'],
    ];

    function getPalette() {
      const theme = document.documentElement.getAttribute('data-theme') || 'ao';
      const map = { ao: 0, shuku: 1, yami: 2, kin: 3 };
      return SEG_PALETTES[map[theme] ?? 0];
    }

    function getCSSVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    // ── Draw ──
    function drawWheel(angle) {
      const canvas = document.getElementById('wheel');
      const ctx = canvas.getContext('2d');
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r  = cx - 8;
      const n  = entries.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (n === 0) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, 2 * Math.PI);
        ctx.fillStyle = getCSSVar('--bg-card');
        ctx.fill();
        ctx.strokeStyle = getCSSVar('--p-dim');
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = getCSSVar('--text-dim');
        ctx.font = '14px Rajdhani, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Keine Einträge', cx, cy);
        return;
      }

      const arc = (2 * Math.PI) / n;
      const palette = getPalette();
      const pGlow  = getCSSVar('--p-glow');
      const pDim   = getCSSVar('--p-dim');
      const gold   = getCSSVar('--gold');
      const textColor = getCSSVar('--text');

      for (let i = 0; i < n; i++) {
        const start = angle + i * arc;
        const end   = start + arc;

        // Segment fill
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, start, end);
        ctx.closePath();
        ctx.fillStyle = palette[i % palette.length];
        ctx.fill();

        // Segment border
        ctx.strokeStyle = pGlow;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.35;
        ctx.stroke();
        ctx.globalAlpha = 1;

        // Label
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + arc / 2);
        ctx.textAlign = 'right';

        const label = entries[i].length > 22 ? entries[i].substring(0, 21) + '…' : entries[i];
        const textR = r - 14;

        // Subtle glow on text
        ctx.shadowColor = pGlow;
        ctx.shadowBlur = 4;
        ctx.fillStyle = i % 2 === 0 ? textColor : gold;
        ctx.font = `bold ${n > 10 ? 11 : 13}px Rajdhani, sans-serif`;
        ctx.fillText(label, textR, 4);
        ctx.shadowBlur = 0;
        ctx.restore();
      }

      // Outer ring
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, 2 * Math.PI);
      ctx.strokeStyle = pGlow;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.6;
      ctx.stroke();
      ctx.globalAlpha = 1;

      // Center circle
      ctx.beginPath();
      ctx.arc(cx, cy, 22, 0, 2 * Math.PI);
      ctx.fillStyle = getCSSVar('--bg-dark');
      ctx.fill();
      ctx.strokeStyle = gold;
      ctx.lineWidth = 2;
      ctx.stroke();

      // Center symbol
      ctx.fillStyle = gold;
      ctx.font = 'bold 14px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('呪', cx, cy);
      ctx.textBaseline = 'alphabetic';
    }

    // ── Spin ──
    function spin() {
      if (spinning || entries.length < 2) {
        if (entries.length < 2) showToast('Mindestens 2 Einträge erforderlich.', 'error');
        return;
      }
      if (spinsLeft <= 0) return;

      spinsLeft--;
      updateSpinCounter();

      closeResult();
      spinning = true;
      document.getElementById('spin-btn').disabled = true;

      const duration  = 4000 + Math.random() * 2000;
      const extraRot  = (6 + Math.random() * 5) * 2 * Math.PI;
      const startAngle = currentAngle;
      const targetAngle = startAngle + extraRot;
      const startTime = performance.now();

      function animate(now) {
        const elapsed  = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        // Ease-out expo
        const eased = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);

        currentAngle = startAngle + (targetAngle - startAngle) * eased;
        drawWheel(currentAngle);

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          spinning = false;
          updateSpinCounter();
          showResult();
        }
      }

      requestAnimationFrame(animate);
    }

    function getWinner() {
      const n   = entries.length;
      const arc = (2 * Math.PI) / n;
      // Pointer is at top (3π/2 in canvas coords)
      const pointerAngle = (3 * Math.PI / 2 - currentAngle % (2 * Math.PI) + 4 * Math.PI) % (2 * Math.PI);
      return Math.floor(pointerAngle / arc) % n;
    }

    function showResult() {
      const idx = getWinner();
      const text = entries[idx];
      document.getElementById('result-text').textContent = text;
      document.getElementById('result-panel').classList.add('visible');
      // Broadcast result to TV
      fetch('/api/wheel/result', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      }).catch(() => {});
      // Domain coin entry: grant +1 coin to the spinning player
      if (text === DOMAIN_COIN_ENTRY) {
        const me = getMe();
        if (me) {
          fetch('/api/players/' + me.id + '/domain-coins', { method: 'POST' })
            .then(r => r.json())
            .then(data => {
              if (data.success) showToast('🪙 +1 Domain-Münze! Du hast jetzt ' + data.domainCoins + '.', 'success');
            })
            .catch(() => showToast('🪙 Domain-Münze konnte nicht gutgeschrieben werden.', 'error'));
        } else {
          showToast('🪙 +1 Domain-Münze! (Bitte einloggen zum Speichern)', '');
        }
      }
    }

    function closeResult() {
      document.getElementById('result-panel').classList.remove('visible');
    }

    // ── Entries ──
    async function loadEntries() {
      try {
        const res = await fetch('/api/wheel');
        const data = await res.json();
        entries = data.length ? data : [...DEFAULT_ENTRIES];
      } catch (e) {
        entries = [...DEFAULT_ENTRIES];
      }
      renderEntries();
    }

    async function saveEntries() {
      try {
        await fetch('/api/wheel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ entries }),
        });
      } catch (e) { /* ignore */ }
    }

    function renderEntries() {
      const list = document.getElementById('entries-list');
      document.getElementById('entries-count').textContent = entries.length;

      if (entries.length === 0) {
        list.innerHTML = '<div class="entries-empty">Noch keine Einträge. Füge oben etwas hinzu.</div>';
        drawWheel(currentAngle);
        return;
      }

      const palette = getPalette();
      const pGlow = getCSSVar('--p-glow');

      list.innerHTML = entries.map((e, i) => `
        <div class="entry-item">
          <span class="entry-dot" style="background:${i % 2 === 0 ? pGlow : getCSSVar('--gold')}; box-shadow: 0 0 5px ${i % 2 === 0 ? pGlow : getCSSVar('--gold')}"></span>
          <span class="entry-name">${escHtml(e)}</span>
          <button class="btn btn-danger" style="padding:0.2rem 0.5rem; font-size:0.7rem;" onclick="removeEntry(${i})">✕</button>
        </div>
      `).join('');

      drawWheel(currentAngle);
    }

    function addEntry() {
      const input = document.getElementById('new-entry');
      const val   = input.value.trim();
      if (!val) { showToast('Bitte Eintrag eingeben.', 'error'); return; }
      if (entries.length >= 20) { showToast('Maximal 20 Einträge.', 'error'); return; }
      entries.push(val);
      input.value = '';
      saveEntries();
      renderEntries();
      showToast('Eintrag hinzugefügt!', 'success');
    }

    function removeEntry(i) {
      entries.splice(i, 1);
      saveEntries();
      renderEntries();
    }

    async function importRules() {
      try {
        const res   = await fetch('/api/rules');
        const rules = await res.json();
        if (!rules.length) { showToast('Keine Regeln gefunden.', 'error'); return; }
        let added = 0;
        for (const r of rules) {
          if (entries.length >= 20) break;
          const label = r.title.length > 40 ? r.title.substring(0, 39) + '…' : r.title;
          if (!entries.includes(label)) { entries.push(label); added++; }
        }
        if (added === 0) { showToast('Alle Regeln bereits vorhanden.', 'error'); return; }
        saveEntries();
        renderEntries();
        showToast(`${added} Regel${added > 1 ? 'n' : ''} importiert!`, 'success');
      } catch (e) {
        showToast('Verbindungsfehler.', 'error');
      }
    }

    document.getElementById('new-entry').addEventListener('keydown', e => {
      if (e.key === 'Enter') addEntry();
    });

    // ── Toast ──
    function showToast(msg, type = '') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = type;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Theme Switcher ──
    const THEMES = ['ao', 'shuku', 'yami', 'kin'];

    function applyTheme(scheme) {
      if (!THEMES.includes(scheme)) scheme = 'ao';
      document.documentElement.setAttribute('data-theme', scheme);
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.scheme === scheme);
      });
      localStorage.setItem('lalling-theme', scheme);
      // Redraw wheel with new theme colours
      drawWheel(currentAngle);
      renderEntries();
    }

    document.getElementById('theme-switcher').addEventListener('click', e => {
      const btn = e.target.closest('.theme-btn');
      if (btn) applyTheme(btn.dataset.scheme);
    });

    // ── Admin check ──
    (function() {
      const me = JSON.parse(localStorage.getItem('lalling-me') || 'null');
      const isAdmin = !!(me && me.isAdmin);
      if (!isAdmin) {
        document.getElementById('spin-btn').style.display = 'none';
        document.getElementById('no-spin-msg').style.display = 'block';
      }
    })();

    // ── Init ──
    applyTheme(localStorage.getItem('lalling-theme') || 'ao');
    loadEntries();

    // ── Dropdown ──
    (function() {
      const btn  = document.getElementById('nav-more-btn');
      const menu = document.getElementById('nav-more-menu');
      if (!btn) return;
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const open = menu.classList.toggle('open');
        if (!btn.classList.contains('active')) btn.dataset.wasActive = 'false';
        if (open) btn.dataset.open = '1'; else delete btn.dataset.open;
      });
      document.addEventListener('click', () => {
        menu.classList.remove('open');
        delete btn.dataset.open;
      });
    })();

    // ── Poker watcher: auto-redirect on new hand or player's turn ──
    (function() {
      let lastRedirectHand = parseInt(localStorage.getItem('lalling-poker-redirect-hand') || '-1');
      let lastMyTurnKey = localStorage.getItem('lalling-last-turn-key') || '';
      async function checkPoker() {
        try {
          const res = await fetch('/api/poker/state');
          if (!res.ok) return;
          const data = await res.json();
          if (!data) return;
          // New hand started
          if (data.phase === 'preflop' && data.handNum > lastRedirectHand) {
            lastRedirectHand = data.handNum;
            localStorage.removeItem('lalling-last-turn-key');
            window.location.href = 'poker-game.html';
            return;
          }
          // My turn
          if (['preflop','flop','turn','river'].includes(data.phase) && data.currentPlayerIdx >= 0) {
            try {
              const me = JSON.parse(localStorage.getItem('lalling-me') || 'null');
              const myIdx = me ? data.players.findIndex(p => p.id === me.id) : -1;
              const turnKey = data.handNum + ':' + data.phase + ':' + data.currentPlayerIdx;
              if (myIdx >= 0 && data.currentPlayerIdx === myIdx && turnKey !== lastMyTurnKey) {
                lastMyTurnKey = turnKey;
                localStorage.setItem('lalling-last-turn-key', turnKey);
                if ('Notification' in window && Notification.permission === 'granted') {
                  try { new Notification('🃏 Dein Zug!', { body: 'Du bist an der Reihe', tag: 'poker-turn', renotify: true }); } catch {}
                }
                window.location.href = 'poker-game.html';
                return;
              }
              if (turnKey !== lastMyTurnKey) lastMyTurnKey = turnKey;
            } catch {}
          }
        } catch {}
      }
      setInterval(checkPoker, 2000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) checkPoker(); });
    })();
  </script>
</body>
</html>
