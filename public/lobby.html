<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Anmelden – Lalling Games</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .signin-wrap {
      max-width: 400px;
      margin: 2.5rem auto 0;
    }

    .signed-in-box {
      background: var(--bg-card);
      border: 1px solid var(--p-dim);
      border-left: 3px solid var(--p-glow);
      border-radius: 0 8px 8px 0;
      padding: 1.2rem 1.3rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .signed-in-name {
      font-family: var(--font-title);
      font-size: 1.1rem;
      color: var(--text);
      font-weight: 700;
    }

    .signed-in-pts {
      font-size: 0.82rem;
      color: var(--text-dim);
      font-family: var(--font-ui);
      margin-top: 0.2rem;
    }

    .signed-in-pts span { color: var(--p-glow); font-weight: 700; }

    /* ── Player list ── */
    .player-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.9rem;
      background: var(--bg-card2);
      border: 1px solid var(--border-mid);
      border-radius: 6px;
      font-family: var(--font-ui);
    }

    .player-row-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--p-bg);
      border: 1px solid var(--p-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--p-glow);
      flex-shrink: 0;
      font-family: var(--font-title);
    }

    .player-row-name {
      flex: 1;
      font-size: 0.95rem;
      color: var(--text);
      font-weight: 600;
    }

    .player-row-name.is-me { color: var(--gold); }

    .player-row-pts {
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .player-row-pts span { color: var(--p-glow); font-weight: 700; }

    .players-grid {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .player-count-label {
      text-align: right;
      font-size: 0.8rem;
      color: var(--text-dim);
      font-family: var(--font-ui);
      margin-bottom: 0.6rem;
      letter-spacing: 0.05em;
    }

    .player-count-label span { color: var(--p-glow); font-weight: 700; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="logo-text">Lalling Games</div>
    <div class="logo-sub">Das Culling Spiel · Das Trinkspiel</div>
    <nav class="nav-links">
      <a href="index.html">Regeln</a>
      <a href="poker.html">Hände</a>
      <a href="gluecksrad.html">Gamble</a>
      <a href="poker-game.html">Poker</a>
      <div class="nav-dropdown">
        <button class="nav-dropdown-btn active" id="nav-more-btn">Mehr ▾</button>
        <div class="nav-dropdown-menu" id="nav-more-menu">
          <a href="lobby.html" class="active">Anmelden</a>
          <a href="spieler.html">Spieler</a>
          <a href="binding-vows.html">Binding Vows</a>
          <a href="admin.html">Admin</a>
            <a href="brainrot.html">Brainrot</a>
        </div>
      </div>
    </nav>
    <div class="theme-switcher" id="theme-switcher">
      <button class="theme-btn" data-scheme="ao"    title="蒼 – Gojo Blue"></button>
      <button class="theme-btn" data-scheme="shuku" title="赫 – Sukuna Crimson"></button>
      <button class="theme-btn" data-scheme="yami"  title="闇 – Hollow Purple"></button>
      <button class="theme-btn" data-scheme="kin"   title="金 – Special Grade"></button>
    </div>
  </header>

  <main>
    <div class="signin-wrap">

      <h2 class="section-title">Anmelden</h2>

      <!-- Shown when already signed in -->
      <div id="signed-in-box" class="signed-in-box" style="display:none">
        <div>
          <div class="signed-in-name" id="signed-in-name"></div>
          <div class="signed-in-pts" id="signed-in-pts"></div>
        </div>
        <button class="btn btn-secondary" id="switch-btn">Wechseln</button>
      </div>

      <!-- Sign-in form -->
      <div id="signin-form" class="form-card">
        <div class="form-group">
          <label for="player-name">Dein Name</label>
          <input id="player-name" type="text" placeholder="z.B. Gojo Satoru" maxlength="30" autocomplete="off" autocapitalize="words" />
        </div>
        <div class="form-group">
          <label for="player-role">Rolle</label>
          <select id="player-role">
            <option value="Normaler Mensch">○ Normaler Mensch</option>
            <option value="Jujutsu Zauberer">⚔ Jujutsu Zauberer</option>
            <option value="Sonderklasse">★ Sonderklasse</option>
            <option value="Verfluchter Geist">👁 Verfluchter Geist</option>
            <option value="Fluchnutzer">🔥 Fluchnutzer</option>
          </select>
        </div>
        <button class="btn btn-primary btn-full" id="signin-btn">Anmelden</button>
      </div>

      <h2 class="section-title">Teilnehmer</h2>
      <div class="player-count-label">Registriert: <span id="player-count">—</span></div>
      <div id="players-grid" class="players-grid">
        <div class="loading">Lade Spieler</div>
      </div>

    </div>
  </main>

  <div id="toast"></div>

  <script>
    const ME_KEY = 'lalling-me';

    function getMe() {
      try { return JSON.parse(localStorage.getItem(ME_KEY)); } catch { return null; }
    }
    function setMe(player) {
      localStorage.setItem(ME_KEY, JSON.stringify(player));
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'show' + (type ? ' ' + type : '');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.className = ''; }, 2800);
    }

    // ── Refresh me from server (get latest points) ──
    async function refreshMe() {
      const me = getMe();
      if (!me) return null;
      try {
        const res = await fetch('/api/players');
        const players = await res.json();
        const fresh = players.find(p => p.id === me.id);
        if (fresh) { setMe(fresh); return fresh; }
        // Player was deleted by admin
        localStorage.removeItem(ME_KEY);
        return null;
      } catch { return me; }
    }

    // ── Update UI based on current identity ──
    function updateUI(me) {
      const formEl     = document.getElementById('signin-form');
      const signedInEl = document.getElementById('signed-in-box');
      const nameEl     = document.getElementById('signed-in-name');
      const ptsEl      = document.getElementById('signed-in-pts');

      if (me) {
        formEl.style.display = 'none';
        signedInEl.style.display = '';
        nameEl.textContent = me.name;
        ptsEl.innerHTML = `<span>${me.points}</span> Punkte`;
      } else {
        formEl.style.display = '';
        signedInEl.style.display = 'none';
      }
    }

    // ── Load + render players ──
    async function loadPlayers() {
      const grid    = document.getElementById('players-grid');
      const countEl = document.getElementById('player-count');
      const me      = getMe();
      try {
        const res     = await fetch('/api/players');
        const players = await res.json();
        countEl.textContent = players.length;
        if (players.length === 0) {
          grid.innerHTML = '<div class="empty-state"><div class="empty-icon">⚔</div><p>Noch niemand angemeldet.</p></div>';
          return;
        }
        const sorted = [...players].sort((a, b) => b.points - a.points);
        grid.innerHTML = sorted.map(p => {
          const isMe = me && p.id === me.id;
          return `
            <div class="player-row">
              <div class="player-row-avatar">${escHtml(p.name.charAt(0).toUpperCase())}</div>
              <span class="player-row-name${isMe ? ' is-me' : ''}">${escHtml(p.name)}${isMe ? ' (Du)' : ''}</span>
              <span class="player-row-pts"><span>${p.points}</span> Pts</span>
            </div>`;
        }).join('');
      } catch {
        grid.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>Fehler beim Laden.</p></div>';
      }
    }

    // ── Sign in ──
    document.getElementById('signin-btn').addEventListener('click', async () => {
      const name = document.getElementById('player-name').value.trim();
      const role = document.getElementById('player-role').value;
      if (!name) { showToast('Bitte Namen eingeben', 'error'); return; }
      const btn = document.getElementById('signin-btn');
      btn.disabled = true;
      try {
        const res    = await fetch('/api/players/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, role })
        });
        const player = await res.json();
        if (!res.ok) { showToast(player.error || 'Fehler', 'error'); return; }
        setMe(player);
        updateUI(player);
        loadPlayers();
        showToast(`Willkommen, ${player.name}!`, 'success');
      } catch { showToast('Verbindungsfehler', 'error'); }
      finally { btn.disabled = false; }
    });

    document.getElementById('player-name').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('signin-btn').click();
    });

    // ── Switch player ──
    document.getElementById('switch-btn').addEventListener('click', () => {
      localStorage.removeItem(ME_KEY);
      updateUI(null);
      document.getElementById('player-name').value = '';
      loadPlayers();
    });

    // ── Init ──
    (async () => {
      const me = await refreshMe();
      updateUI(me);
      await loadPlayers();
    })();

    // ── Theme ──
    const THEMES = ['ao', 'shuku', 'yami', 'kin'];
    function applyTheme(scheme) {
      if (!THEMES.includes(scheme)) scheme = 'ao';
      document.documentElement.setAttribute('data-theme', scheme);
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.scheme === scheme);
      });
      localStorage.setItem('lalling-theme', scheme);
    }
    document.getElementById('theme-switcher').addEventListener('click', e => {
      const btn = e.target.closest('.theme-btn');
      if (btn) applyTheme(btn.dataset.scheme);
    });
    applyTheme(localStorage.getItem('lalling-theme') || 'ao');

    // ── Dropdown ──
    (function() {
      const btn  = document.getElementById('nav-more-btn');
      const menu = document.getElementById('nav-more-menu');
      if (!btn) return;
      btn.addEventListener('click', e => {
        e.stopPropagation();
        menu.classList.toggle('open');
      });
      document.addEventListener('click', () => menu.classList.remove('open'));
    })();

    // ── Poker watcher: auto-redirect on new hand or player's turn ──
    (function() {
      let lastRedirectHand = parseInt(localStorage.getItem('lalling-poker-redirect-hand') || '-1');
      let lastMyTurnKey = localStorage.getItem('lalling-last-turn-key') || '';
      async function checkPoker() {
        try {
          const res = await fetch('/api/poker/state');
          if (!res.ok) return;
          const data = await res.json();
          if (!data) return;
          // New hand started
          if (data.phase === 'preflop' && data.handNum > lastRedirectHand) {
            lastRedirectHand = data.handNum;
            localStorage.removeItem('lalling-last-turn-key');
            window.location.href = 'poker-game.html';
            return;
          }
          // My turn
          if (['preflop','flop','turn','river'].includes(data.phase) && data.currentPlayerIdx >= 0) {
            try {
              const me = JSON.parse(localStorage.getItem('lalling-me') || 'null');
              const myIdx = me ? data.players.findIndex(p => p.id === me.id) : -1;
              const turnKey = data.handNum + ':' + data.phase + ':' + data.currentPlayerIdx;
              if (myIdx >= 0 && data.currentPlayerIdx === myIdx && turnKey !== lastMyTurnKey) {
                lastMyTurnKey = turnKey;
                localStorage.setItem('lalling-last-turn-key', turnKey);
                if ('Notification' in window && Notification.permission === 'granted') {
                  try { new Notification('🃏 Dein Zug!', { body: 'Du bist an der Reihe', tag: 'poker-turn', renotify: true }); } catch {}
                }
                window.location.href = 'poker-game.html';
                return;
              }
              if (turnKey !== lastMyTurnKey) lastMyTurnKey = turnKey;
            } catch {}
          }
        } catch {}
      }
      setInterval(checkPoker, 2000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) checkPoker(); });
    })();
  </script>
</body>
</html>
